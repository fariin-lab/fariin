name: TestFlight build status

# Report the processing/compliance status of the most recent builds so we know why a build
# hasn't appeared in TestFlight yet. Uses the same App Store Connect API key as the upload lane.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
      BUNDLE_ID: "com.kulan.messenger.native"
    steps:
      - name: Write API key
        run: printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Install deps
        run: pip install --quiet pyjwt cryptography requests
      - name: Report status
        env:
          P8: ${{ runner.temp }}/AuthKey.p8
        run: |
          python3 - <<'PY'
          import os, time, jwt, requests, sys
          key_id = os.environ["ASC_KEY_ID"]; issuer = os.environ["ASC_ISSUER_ID"]
          bundle = os.environ["BUNDLE_ID"]
          with open(os.environ["P8"]) as f: private_key = f.read()
          token = jwt.encode({"iss": issuer, "iat": int(time.time()), "exp": int(time.time())+1200,
                              "aud": "appstoreconnect-v1"}, private_key,
                             algorithm="ES256", headers={"kid": key_id, "typ": "JWT"})
          H = {"Authorization": f"Bearer {token}"}; BASE = "https://api.appstoreconnect.apple.com/v1"
          app = requests.get(f"{BASE}/apps", headers=H, params={"filter[bundleId]": bundle}).json()["data"][0]["id"]
          r = requests.get(f"{BASE}/builds", headers=H, params={
              "filter[app]": app, "limit": 6, "sort": "-version",
              "fields[builds]": "version,processingState,uploadedDate,expired,usesNonExemptEncryption"}).json()
          print(f"{'build':>6}  {'processing':<11} {'compliance':<16} expired  uploaded")
          for b in r.get("data", []):
              a = b["attributes"]
              enc = a.get("usesNonExemptEncryption")
              comp = "MISSING (answer!)" if enc is None else ("set: exempt" if enc is False else "set: uses-encryption")
              print(f"{a['version']:>6}  {str(a.get('processingState')):<11} {comp:<16} {str(a.get('expired')):<7} {a.get('uploadedDate')}")
          print("\nInstallable = processing VALID AND compliance not MISSING.")

          # WHY A VALID BUILD CAN STILL BE INVISIBLE IN THE TESTFLIGHT APP. Processing and compliance
          # only decide whether the build is USABLE; what decides whether a tester SEES it is whether
          # it has been given to a group. A build with no groups sits in App Store Connect looking
          # perfectly healthy and never reaches anyone's phone, which is indistinguishable from "the
          # upload failed" unless you ask this question.
          # WHAT ACTUALLY DECIDES WHETHER A BUILD APPEARS IN THE TESTFLIGHT APP.
          #
          # `processingState` only says the binary is usable. The field that says a tester can INSTALL it
          # is buildBetaDetail.internalBuildState — a build can be VALID and still sit at
          # PROCESSING/MISSING_EXPORT_COMPLIANCE there. Groups matter too, but they are not the whole
          # story: a build can be visible without appearing in the betaGroups relationship, so reading
          # only that led to the wrong conclusion once already.
          print("\nPer build: install state, groups, testers")
          for b in r.get("data", []):
              bid, ver = b["id"], b["attributes"]["version"]
              def rel(path, params=None):
                  try:
                      return requests.get(f"{BASE}/builds/{bid}/{path}", headers=H, params=params or {}).json()
                  except Exception as e:
                      return {"error": str(e)}
              detail = (rel("buildBetaDetail").get("data") or {}).get("attributes", {})
              groups = rel("betaGroups", {"fields[betaGroups]": "name,isInternalGroup"}).get("data", [])
              testers = rel("individualTesters", {"limit": 5}).get("data", [])
              locs = rel("betaBuildLocalizations", {"fields[betaBuildLocalizations]": "whatsNew"}).get("data", [])
              names = ", ".join(
                  f"{g['attributes'].get('name')}"
                  f"{'(int)' if g['attributes'].get('isInternalGroup') else '(ext)'}"
                  for g in groups) or "none"
              print(f"  {ver:>4}: internal={detail.get('internalBuildState')} "
                    f"external={detail.get('externalBuildState')} "
                    f"expired={detail.get('autoNotifyEnabled')} "
                    f"groups=[{names}] individualTesters={len(testers)} whatsNew={len(locs)}")
          PY
