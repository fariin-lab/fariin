name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            TEN REPORTS FROM THIS MORNING. The big one is the pause bug, which is finally root caused after weeks.

            THE STORY PAUSING BY ITSELF IS FIXED, AND IT WAS EVERY TAP. The pause was wired to the moment your finger touches the screen instead of to the hold, so a normal tap paused the story and then depended on your finger lifting to unpause it. The story sits under several other gestures that can take the touch away mid press, and when that happens nothing ever tells it the press ended. Nothing else could clear it either, so one unlucky tap froze the story for the rest of the visit. That is why it felt random. It now pauses only when the hold actually engages, so a tap can never leave it stuck, plus two safety nets. Holding to pause still works exactly as before, and so do the two pauses you wanted kept, the upload and the scroll down.

            THE NAME UNDER A CARD NO LONGER DISAPPEARS. When a story opened, the whole card was hidden, name included, and the name only came back when the story finished closing. That is your "name is coming late". Only the picture steps aside now, so the name never leaves and there is nothing to arrive late.

            OPENING FROM A CHAT RING IS A REAL CIRCLE NOW. It used to grow a circle wider than the card, so the card's own edges cut the sides flat. That is your "left and right feeling cut". The circle now becomes the card instead of outgrowing it, so it can never be clipped sideways. The story screen's header and reply bar also stop being drawn in a rectangle around the circle, which is the mirror effect you circled.

            SCROLL DOWN STOPS SOONER. Measured off your two screenshots, the card you called too far is 22% of the screen and the one you wanted is 46%, so that is the new limit. The extra drift past the limit is more than halved so the stop feels fixed.

            ALL THE VIEWER CARDS KEEP THEIR BLUR. Only the centred card was blurred because iOS silently drops a blur on any card drawn slightly faded, which is every card except the middle one. They use a pre made blur now, so they all match.

            A VIDEO REMEMBERS WHERE IT WAS. Watch to 20 seconds, scroll up, swipe the carousel, come back, and it carries on at 20 seconds instead of restarting. The progress bar resumes with it.

            SWITCHING TO THE NEXT PERSON IS FASTER. The next person's screen is now built and laid out while you are still watching the current one, so the tap does not pay for it.

            ALSO: the caption hides as soon as you start pulling down. Long pressing a name shows plain text with no white box behind it, and the name is no longer on screen twice as the card flies back. The archived page uses the app's own long press menu instead of Apple's. And the black bars at the top and bottom of your own story are gone.

            WHAT TO CHECK FIRST: tap through a lot of stories quickly and see if any of them freezes. Then open from a chat ring and watch the circle.

            STILL OPEN: edited videos still export with black bars instead of the gradient.

        run: fastlane beta
