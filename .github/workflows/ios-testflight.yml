name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            PLEASE TRY THIS FIRST. Send a video. It should appear the INSTANT you tap send. It used to sit there doing nothing for nearly 4 seconds while the video compressed, because the bubble waited for the thumbnail and the thumbnail was only made at the very end. Now one frame is grabbed straight away and the compressing happens behind it.

            Then send a LONG video, 15 seconds or more. If it fails, it will now tell you WHY on screen instead of only saying "Not delivered". Please send me that sentence. It is the one thing I need to fix the real cause instead of guessing.

            VIDEO IS SMALLER AND FASTER NOW. It sends at 540p instead of 720p, which is about twice as quick to compress and half the data. Signal sends everything at 480p, which is how they are so fast; 540p is the middle, still sharper than theirs. It will look slightly softer than before. Tell me if it is too soft.

            YOUR VIDEOS WERE CARRYING YOUR LOCATION. When your phone records a video it writes the GPS coordinates inside the file, and we were passing that straight through. Encryption did not help, because the person receiving it is meant to open it: they got your exact location, permanently, readable in any photo app. It is stripped now. Videos already sent still carry it and nothing can change that.

            APP LOCK NOW COVERS THE APP SWITCHER. Before, you could turn on App Lock and your last open chat was still sitting in the multitasking view for anyone who picked up your phone. Face ID on the front door, window wide open.

            MESSAGE PREVIEW ACTUALLY WORKS NOW. That switch has never done anything. Turn it off and your notifications say "New message" with no name at all. That matters beyond the lock screen, because every word in a notification passes through Apple's servers.

            LAST SEEN IS ENFORCED BY THE SERVER. "My friends" used to be enforced only by the app doing the looking, so anybody reading the database directly got your last seen time anyway.

            THE "EVERYONE" STORY AUDIENCE IS GONE. It never helped anybody find you, there is no browse or explore anywhere in the app, so all it did was let a stranger who already found your profile watch your story. In exchange it forced every story to be stored unencrypted and was the one place an App Store reviewer could see a stranger's content. Signal has no public story either, for the same reason.

            ALSO FIXED. Forward is no longer offered on a deleted message, where it used to send an empty one. A forwarded video or album shows its pictures immediately instead of blank for up to 10 seconds. The play badge no longer sits on top of the upload spinner.

            WHAT TO CHECK. Settings, Account, Sign-in Methods should have a Remove button, ask you to sign in again, and email you afterwards. Post a story and check Everyone is gone. Then the ordinary things: send a photo, open old chats, make a call.

        run: fastlane beta
