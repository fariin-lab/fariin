name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            STORIES BUILD. Eight changes, all of them stories.

            LONG PRESS ON THE STORIES ROW is the app's own menu now, not Apple's. What lifts off the row is a photograph of the card that is on screen, so it no longer reloads its picture, move its avatar or wear a caption the card does not have. The row and a chat message press the same way.

            THE CENTRE CARD IN THE VIEWERS CAROUSEL no longer ends up behind its neighbours. The middle of that row is the real story, and the signal that hides it only knew about fingers, so paging the sheet sideways left it uncovered for a third of a second while the other cards slid over the top of it.

            THE CAPTION AND SHADOW ON A VIDEO CARD are gone for good. Two earlier attempts moved when the picture was taken; this one changes what the picture is, so there is no timing left to get wrong.

            THE RING HOLDS STILL while you are inside somebody's story, the way the order already does. Watching their last unseen story used to grey the ring out underneath you, and you saw it change colour at the moment the story landed back on the card.

            THE VIDEO EDITOR shows the background the export actually bakes. You were framing clips against a blur and getting a gradient back.

            DELETING YOUR LAST STORY on a poor connection now works. The app could not tell an empty result from an empty cache, so the card stayed on the row.

            SPECULATIVE DOWNLOADS stand down on mobile data. A guard that was meant to stop this only covered Low Data Mode, which nobody turns on, so the app was pulling story videos over your data plan without being asked. Covers still load, so nothing gets slower to open.

            THE UPLOADING CARD cannot go blank half way through an upload any more.

            WHAT TO CHECK. Long press the stories row, several cards, and check the lift is the card itself. Open your own story, pull the viewers sheet up, and swipe sideways fast, watching that the middle card stays on top. Post a video story and check the card has no caption on it. Watch a friend's last unseen story and check their ring only greys after you leave.

            STILL OPEN, do not report these again yet: the story pausing by itself after you come back into the app, and an EDITED video (drawing or text on it) still exporting with black bars instead of the gradient. Both are next.
        run: fastlane beta
