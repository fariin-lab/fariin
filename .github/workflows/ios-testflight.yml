name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            PLEASE TRY THIS FIRST. Open your own story and swipe up. The story should shrink into the card under your finger, the viewers sheet should rise with it, and they should move as one thing. Then drag the sheet down. The sheet should close and your story should grow back to full screen. The viewer must NOT close. That was the big rebuild in this batch: the whole interaction is our own system now, built the way Telegram builds theirs, after reading their actual code.

            THE BLACK HEADER ON STORY CLOSE IS GONE. Your screenshot: drag a story down and a black band rides on top of the picture. The band was the strip of screen above the story card, painted black inside the shrinking screen. The instant a close starts now, that black steps aside and only the picture pulls away over the chat list, like the Snapchat clip you sent. If you release and it springs back, the black returns with it.

            SENDING SEVERAL PHOTOS: EVERY PICTURE HAS ITS OWN RING NOW. Each one fills with its own progress, and each one carries an X while it uploads. Tap the X and only that picture is cancelled; the rest of the album keeps going and arrives without it.

            CANCEL ACTUALLY CANCELS NOW. You found it: cancel an album mid-upload, and a minute later the photos arrived anyway. The truth is the cancel only hid the bubble; the upload kept running behind it. Now cancel reaches into the upload itself and stops it. A cancelled album can never land late.

            THE STORY + BUTTON USES OUR OWN PICKER, ALWAYS. It was opening Apple's photo picker, and if you had started with a video it would only show you videos. Now the + always opens our Photos and Albums grid, it always shows both pictures and videos, and if you add a picture to a video story the whole post moves into the full editor that carries both side by side.

            THE PROFILE PHOTO MELTS INTO THE PAGE NOW. Your circles were real: a dark band arriving at the name, and a hard line where the photo met the background. Both were the shape of the fade, not a missing layer. The blur now stays out of the name area and the fade ends flat before the photo runs out, so there is no line left to find. No scrim, no darkening, works with bright and dark photos in both modes.

            RESET ALL NOTIFICATIONS WORKS. It was greyed out unless something was muted, and it never touched the things you had actually changed, like the sound and the preview switch on that same page. It is always tappable now and resets the page too. It does not touch Show Notifications, on purpose.

            CAN'T CALL UPDATES LIVE. If someone sets calls to No One while your chat with them is open, the next tap on the call button says so. No need to leave and come back. Part of this was already in the last build, so make sure you are on this one before testing.

            WHAT TO CHECK, IN ORDER. Your story: swipe up slowly, let go halfway, drag the sheet down, tap the dark area, swipe the little cards row, tap the middle card. A friend's story: drag down to close, no black band, fast flick too. Send an album of 5 photos on slow internet and cancel one with its X, then send another and cancel the whole thing with long press. Story +: photo first then add a video, video first then add a photo. And the profile page of someone with a dark photo.

        run: fastlane beta
