name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            Three fixes from your photos of the last build.

            The profile photo reaches both edges of the screen now. There was a strip of empty page down the left and the photo ran off the right.

            Someone with no profile picture gets the same round glass buttons as everyone else. They still had the old ones with words underneath.

            The buttons are in the order you asked for everywhere, on people and on groups: voice call, video call, mute, search, more.

            And the Avatar / Poster switch when you set a photo is real glass instead of the plain grey one iOS gives you.

            Everything from the last build is still here:

            Profiles have a new top. The person's photo now fills the whole width of the screen instead of sitting in a small circle, and their name and username sit on the photo itself.

            The photo does not stop at a line any more. It dissolves into the page through a soft haze made from the photo's own colours, so the top of the screen reads as one surface in both light and dark mode. The name goes dark on a pale photo and light on a dark one, worked out from the picture, so there is never a black or white box behind the text.

            Voice, video, mute, search and more are now five glass circles with no words under them.

            Stories moved. If someone has posted, you see up to three small round previews at the top of their profile with the real number beside them, so seven stories shows three circles and "7 Stories". Tap them to watch.

            Tap the photo and it opens full screen, growing out of the header and keeping the picture's real shape.

            Setting your own photo is a new screen: move and scale it once, then flip between Avatar and Poster to see how it will look as both the small round picture and the big header, before you keep it.

            Groups got the same header. One difference you may notice: on a group the photo starts below the top bar rather than running under it. That page is built differently underneath and I did not want to rebuild it in the same build as everything else.

            If you prefer the old look, Settings, Privacy and Security, Profile Layout, Classic Circle Profile. Anyone with no photo at all keeps the old circle either way.

            PLEASE TRY: a profile of someone with a photo, in light mode AND dark mode, and tell me whether you can see a line where the photo ends. Then someone with a story, to see the small round previews at the top. Then tap the photo to open it full screen and drag down to close. Then a group. Then someone with a very bright photo, where the name is supposed to turn dark on its own.

        run: fastlane beta
