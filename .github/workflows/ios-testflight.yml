name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            BUILD 829: THE NEW GROUP CALL SCREEN.

            GROUP CALLS: a real layout that fits everyone (most-square grid, up to 6 on screen, the rest in a strip below). A thin green border shows who is speaking, steady, no flicker. Tap anyone to make them big, tap again to go back. Your own video sits small in the corner when others are in, full screen when alone. Camera off shows the person's photo. A small badge shows who is muted and who has a poor connection. Joins and leaves are announced. Smoother movement, Reduce Motion respected. The header and bottom buttons are unchanged.
            PEOPLE LIST: In call with the count, who speaks, who is muted, who has video, the host. Tap a person to make them big.

            PLEASE TEST: a group or link call with 2, 3 and 4+ people; turn a camera off and on; tap a tile; open the people list; talk and watch the green border.

            EARLIER (build 828): THE + CRASH IS FIXED, PLUS CALL LINK AND CALL FIXES.

            + BUTTON: opening the attach sheet no longer crashes the app.
            ALL MEDIA: Share works for photos, videos, voice, files, GIFs and links every time. The Share / Selected / Delete bar is Apple's own bottom toolbar.
            CALLS: minimize and restore move slower and smoother. A ringing video call's small card shows your camera.
            CALL LINKS: rows work like call rows (tap to join, (i) for details, the time). Create a Call Link is instant. Blue glass Done button, rounder cards. NEW Call Type: Video or Voice (a Voice link keeps every camera off).
            GROUP CALLS: your own photo shows, your tile is centred, glass top buttons, and the people button opens Waiting for others with Share link and Require approval.
            CHAT: your reaction shows at once on old messages too, and removing it works. On a wallpaper, an incoming bubble grows cleanly when you react.

            PLEASE TEST: tap + in a chat; share a mix from All Media; make a Voice call link and join it from another phone; react to an old message.

            EARLIER (build 827): BIG FIX BUILD: 130+ CALL AND CHAT FIXES FROM TWO DEEP AUDITS.

            CALLS: hold no longer turns your camera back on. A normal call can't ring you during a group call. Speaker stays where you put it after a network blip. Other apps' music stops when you call. A call that fails on your side says Call failed, not Missed. Cancelling and quickly calling someone else no longer rings the first person. Answering just as they hang up no longer logs Answered. Minimize and restore use a quick 0.2s shrink and grow. The self-view tile stays in its corner. VoiceOver labels on every call button.
            GROUP CALLS: joining no longer wipes the call record. Ending while connecting really ends it. A dropped room is noticed.
            CALL LINKS: the video button joins with video. Renamed links keep their name. A link deleted on another phone can be removed.
            CALL SECURITY: call setup is now end-to-end encrypted. Caller name and photo come from the real profile. Limits on repeated calls.
            CHAT: opening a chat only marks as read what you actually see. The chat opens exactly on the Unread divider. Tapping a quote while older messages load no longer says Not loaded. Search no longer pulls you back. The composer no longer stays high after swiping back with the keyboard up. Touching the list mid-scroll no longer freezes new messages. Fewer jumps when reactions, photos or older pages land. GIFs scroll smoother. Typing is lighter.
            ALSO: All Media shares videos and keeps its tabs in Select. Message not sent opens as a real menu. Fariin chat no longer borrows another chat's wallpaper. No grey row after swiping back.

            PLEASE TEST: a call with someone on THIS build (an older build cannot answer an encrypted call from this one); hold a video call for a phone call; open a chat with many unread; tap a quote while scrolling up; swipe back from a chat with the keyboard up.

            EARLIER (build 826): CALLS: STEADIER CALLS, GROUP CALLS, CALL LINKS.

            CALLS ENGINE: more of the connection and recovery work, so calls hold up better on a weak network.
            CALL SCREEN opens instantly when a call starts.
            GROUP CALLS: minimize to the small floating card like 1:1 calls. Joining by link starts with the camera off. A real speaker switch.
            CALL LINKS: the Create Call Link sheet and the link details page are cleaner.
            CALLS TAB: new new-call icon; the new-call list has tighter rows.
            CHAT KEY: after entering the key the chat opens straight to typing, no "accepted" banner.
            FILES: closing a file brings you back to the same chat.
            PINNED ALBUM shows one picture again.
            CHAT LIST: chats that an older build wrongly showed as "Say hello" are repaired.
            MINIMIZE: the call screen zooms down into the small card, and tapping the card zooms it back. A minimized video call shows the video card even before anyone's camera is up.
            CALL LINK ROWS: long press for Video Call, Voice Call, Select, Delete. Select works on links.
            ALL MEDIA: Share works for voice messages.
            MESSAGE NOT SENT: the popup has no arrow.
            CHAT LIST: no grey row left behind after swiping back from a chat (keyboard open or not).
            REACTIONS: the + sheet has every emoji, flags included, grouped like the keyboard. On a wallpaper, an incoming bubble grows cleanly when you react.

            PLEASE TEST: minimize a video call while it rings, then tap the card; long press a call link; share voice messages from All Media; a call on mobile data.

            EARLIER (build 825): PHOTO FIXES: NO MORE STUCK BLURRED PHOTOS, BIGGER ALBUMS.

            CANCEL: tapping X on a photo being sent (even at 99%) now removes it cleanly; no more blurred photo with an endless spinner.
            STUCK SENDS: if the other person's upload was interrupted, the spinner stops instead of spinning forever.
            ALBUMS: 3 or 4 tall photos (like screenshots) now fill the full album width.
            ATTACH SHEET: the swipe back out of a folder follows your finger.
            PHOTO TAPS: the first tap on a photo is no longer ignored after scrolling.

            PLEASE TEST: send a photo and tap X while it uploads; send 3-4 screenshots as one album; swipe back in a photo folder.

            EARLIER (build 824): GLOBAL SEARCH, FILES IN APPLE'S VIEWER, AUTO-SCROLL, BLOCK FIXES AND MORE.

            SEARCH: names match by the start of each word. Things you searched before come first. People found by username show under Global Search (3, then Show More).
            SENDING: sending anything now always scrolls the chat to your new message.
            REOPENING A CHAT: a small scroll is not remembered; a real scroll still is.
            FILES open in Apple's own viewer (PDFs too). Attach sheet: swipe right to leave a folder.
            CHAT LIST: an album shows up to 3 overlapping photos. The verified badge stays blue on iOS 26. No more "Say hello" on a chat whose last message was a photo.
            BLOCKS: a reply to a message sent while blocked says "Not available".
            RESTRICTED CHAT: new icon, "You turned off Restricted Chat" for your own change, tidier page.
            PINNED ALBUM: both photos the same size with white edges.
            HEADER BLUR: shorter without a pinned bar, lighter, and lighter over dark wallpapers.
            INSIGHTS: simpler summary cards, no sort bar.
            CALLS: no pulsing rings while calling, your own End closes at once, faster recovery on network change.

            PLEASE TEST: search a username by its first letters; send photos and voice while scrolled up; open a PDF; check a chat list album row.

            EARLIER (build 823): RESTRICTED CHAT: MESSAGES NO LONGER COVER THE MESSAGE BOX.

            Turning Restricted Chat on or off no longer lifts the messages over the message box, the date and the jump button.

            CHAT HEADER BLUR: messages scrolling under the header are now truly blurred, strongest at the top and fading smoothly to sharp.

            PLEASE TEST: in a chat, turn Restricted Chat on, go back to the chat, then turn it off and go back again.

            EARLIER IN THIS ROUND (build 822): CHAT HEADER: SMOOTH, AND IT MATCHES YOUR WALLPAPER.

            The top of a chat now fades smoothly with no line. With a wallpaper, the header shows the wallpaper itself, so messages melt into it as they scroll up. Without one it uses the plain page colour.

            PLEASE TEST: scroll a chat with no wallpaper, with a photo wallpaper and with a gradient; check light and dark mode.

            EARLIER IN THIS ROUND (build 821): RESTRICTED CHAT RULES, CHAT HEADER BLUR.

            RESTRICTED CHAT: each person has their own switch. The chat is restricted while either of you has it on. You can turn yours off, but not theirs: you can ask them, and they choose Turn Off or Keep On from the notice in the chat or from the Restricted Chat page. Requests lapse after a day.

            RESTRICTED CHAT FIX: turning it on or off no longer pushes messages under the message box.

            CHAT HEADER: the blur behind the header is there from the first moment a chat opens and fades softly at its bottom edge.

            PLEASE TEST: open chats from the list and watch the header; on two phones, turn Restricted Chat on from one, try to turn it off from the other, answer the request.

            EARLIER IN THIS ROUND (build 820): INSIGHTS: NEW LAYOUT, PROFILE VIEWS, APPLE TABS.

            INSIGHTS: date range and a Last 28 Days pill at the top. Every figure is a card with its change against the previous period. Overview: Total Glowers and Profile Views with daily bars. Stories: views, reactions, stories posted, views per story, then your stories. Audience: a summary with Gained and Unglows, and top countries. Items open what they count.

            PROFILE VIEWS: opening someone's profile now counts as one view for them, once a day per person. Only the number is shown, never who.

            TABS: Insights and Glowers/Glowing use Apple's own glass segmented control.

            PINNED ALBUM: the second photo now peeks out behind the first.

            HEADER BLUR: opening a chat should show the header blur from the first moment of the slide.

            PLEASE TEST: open Insights and each tab, change the period; open a friend's profile from another phone and check Profile Views the next day; look at a pinned album.

            EARLIER IN THIS ROUND (build 819): REACTION PREVIEWS, PROFILE LINKS, ENCRYPTION PAGE, FILE SHARE.

            CHAT LIST: a reaction to a photo shows the real photo (an album up to three); a reaction to a voice note or file shows a real icon, not an emoji.

            USERNAMES: tapping your own name, link or card opens your profile; the person you are chatting with opens their profile; anyone else opens their chat.

            FILES: the file preview has a Share button. A reacted file puts its time on the reaction row.

            ENCRYPTION: a cleaner page, the code and numbers in one card, Scan in glass.

            ALSO: the pin button in the pin bar is glass; Add another account shows Google, Apple and email.

            PLEASE TEST: react to a photo, an album, a voice note and a zip, then look at the chat list; tap your own and the other person's username in a chat; open a file and tap Share.

            EARLIER IN THIS ROUND (build 818): INSIGHTS REDESIGN, RESTRICTED CHAT, 120HZ SCROLLING, HEADER BLUR.

            INSIGHTS: three tabs. Overview (tap a figure to chart it), Content (your stories, sort by Latest, Views or Reactions), Audience (Glowers growth with Unglows, top countries, when your stories are watched). The history now loads.

            RESTRICTED CHAT: one switch on a contact's page (was Disable Sharing). Blocks screenshots and screen recording, forwarding, copying and saving for both people.

            SCROLLING: the app may now run at 120Hz on Pro iPhones.

            HEADER BLUR: opening a chat from the chat list should show the header blur from the start of the slide, as it does from Archive.

            LINKS: tapping fariin.com/u/name in a message opens that chat in the app.

            PINNED ALBUM: the pin bar shows two stacked photos. GLOWERS PAGE: the Glowers/Glowing switch is the tab bar's glass.

            PLEASE TEST: open Insights and each tab; turn on Restricted Chat and try a screenshot; scroll a long chat; open a chat from the list and watch the header blur; tap a fariin.com/u/ link.

            EARLIER IN THIS ROUND (build 817): DISABLE SHARING, FASTER CHATS, REACTION FACES.

            DISABLE SHARING: on a contact's page, under Disappearing Messages. No Screenshots, No Forwarding and No Saving, for both people in the chat. The chat shows who turned each one on or off.

            OPENING A CHAT: starts sooner, and the grey row fades when you come back instead of staying stuck while the chat loads.

            SCROLLING: photos no longer load on the main thread, so scrolling past albums should be smooth.

            REACTIONS: when both of you use the same emoji, both faces show (up to three), not a number.

            ONE-TIME PHOTO AND VOICE: the sender can open their own once too.

            PROFILE CARD: Send Message on your own card, or in that person's chat, opens the keyboard. Share Profile sends the link only.

            INSIGHTS CARD: no lock icon; from 100 Glowers it says "Explore insights from your Stories and Glowers".

            PLEASE TEST: turn on each Disable Sharing switch and try a screenshot, Forward, Copy and Save in that chat; open chats from the list; scroll a chat with albums; react with the same emoji on both phones; open your own one-time photo twice.

            EARLIER IN THIS ROUND (build 813): ONE-TIME PHOTO AND VOICE ARE PROTECTED, SHARE PROFILE AND SEND MESSAGE ARE FAST.

            ONE-TIME PHOTO: no Save, no Share and no edit button. The photo is left out of screenshots and hidden while the screen is recorded.

            ONE-TIME VOICE: the page is left out of screenshots. While the screen is recorded or shared the note does not play, and the page says why.

            SHARE PROFILE: the sheet closes as soon as you tap Send and the card goes to all chats at once.

            PROFILE CARD: Send Message opens the chat right away.

            PLEASE TEST: open a one-time photo, take a screenshot and look at it in Photos; start a screen recording and open a one-time photo and a one-time voice note; Share Profile to two chats; tap Send Message on a profile card.

            EARLIER IN THIS ROUND (build 812): PROFILE: ABOUT CARD AND INSIGHTS.

            MY PROFILE: a new About card with your joined date and "Complete your profile" (photo, name, username, bio, link) with a progress bar. Tap it to open Edit. The small Joined pill under the bio moved into this card. The Glowers and Glowing card and Posted stories are unchanged.

            INSIGHTS: a new Insights row under the Glowers card. It is locked until 100 Glowers and shows how far you are. After 100: last 7, 28 or 90 days, story views, reactions, stories posted, views per story with change against the period before, views by day, Glowers gained and lost, top stories including expired ones, and the stories live now.

            PLEASE TEST: open your profile; check the About card and the progress count; tap Complete your profile; tap Insights.

            EARLIER IN THIS ROUND (build 811): BLURRED PHOTOS, MENU ABOVE THE KEYBOARD, ONE-TIME MEDIA, SWIPE MUTE, DEVICE LOCATION.

            CHAT: a received photo no longer stays blurred after it has loaded. The long-press menu opens above the keyboard. One-time photos and voice notes are spent the moment they open and cannot be opened again. A photo with a caption and a reaction shows its time beside the reaction. The voice note bar hides when the note finishes.

            CHAT LIST: swipe Mute is one tap (mute, or unmute). The timed choices are still in the long-press menu.

            PROFILE: Share Profile sends the profile card. Send Message on a profile card opens that chat on top, and Back returns to where you were.

            STORIES: posted stories open right after sign-in. The Posted stories card spacing is tidied.

            ATTACH SHEET: the album list and the album slide together.

            DEVICES: each device shows its city and country.

            PLEASE TEST: open a chat with new photos; long-press a message with the keyboard up; open a one-time photo and a one-time voice note twice; swipe Mute in the chat list; Share Profile to a friend; Settings > Devices.

            EARLIER IN THIS ROUND (build 810): FARIIN LIGHT/DARK, HEADER TEXT, CAPTION REACTIONS, ALBUM CANCEL, KEYBOARD ON TAP.

            FARIIN CHAT: never uses a wallpaper, and its posts change with light/dark at once.

            CHAT: the name and "online" in the header change colour right away with light/dark or a new wallpaper. Tapping a message keeps the keyboard open. A photo with a caption: double-tap the caption to react, and reactions sit inside under the caption. A cancelled photo in a group leaves at once, even the last one.

            ATTACH SHEET: Back from the album list is instant.

            DEVICES: bigger icons, and the device sheet is solid light/dark.

            CHAT LIST: the disappearing badge is a little smaller and looks like a notch in the photo.

            PLEASE TEST: switch light/dark in Fariin and in a chat with a wallpaper; tap messages with the keyboard up; react on a caption; send 2 photos and cancel one.

            EARLIER IN THIS ROUND (build 809): WALLPAPER: SWIPE YOUR PHOTOS, CANCEL DOES NOT SAVE, NEW RESET MENUS.

            WALLPAPER: tapping a photo you already use opens it without pinch or drag, and you can swipe through all your wallpapers. A photo you pick and close without Apply is not kept. Each page's ... menu shows its own two resets.

            PLEASE TEST: Settings > Wallpaper, tap your photo and swipe; pick a photo and tap X; open the ... menu on Wallpaper and on Chat Color.

            EARLIER IN THIS ROUND (build 808): ONE-TIME MEDIA, MENU ABOVE THE KEYBOARD, APPLE PASSWORD, ALBUM CANCEL, CLOCK.

            ONE-TIME: a photo opens once only; a voice plays once and the page closes, and it is downloaded before you open it; with a reaction the bubble keeps your normal shape.

            CHAT: keyboard open, long-press the last message: the menu stays above the keys. The sending clock lines up with the time. A photo you cancel in a group leaves at once.

            PASSWORD: an Apple account with a hidden email can set a new password by signing in with Apple. Forgot password is a link.

            LOG OUT: a playing voice note stops.

            PLEASE TEST: open a one-time photo twice; play a one-time voice to the end; keyboard up, long-press the last message; send 3 photos and cancel one.

            EARLIER IN THIS ROUND (build 807): VOICE BAR MAKES ROOM IN CHATS, DEVICES SHEET, ALBUM FROM RECENTS WITHOUT SLIDE.

            CHATS: the playing voice note bar now pushes the list down instead of covering "Pinned".

            DEVICES: smaller rows, round blue icons, and a device opens as a sheet with a red Sign Out button.

            ATTACH SHEET: Album from Recents opens with no slide; folders and Back still slide.

            CHAT LIST: the disappearing badge is a little smaller with a grey clock.

            WALLPAPER PREVIEW: the close button, the dark/light button and swiping between wallpapers work again.

            PLEASE TEST: play a voice note and leave the chat; open Settings > Devices and tap a device; open Album from Recents, then a folder, then Back.

            EARLIER IN THIS ROUND (build 806): KEYBOARD STAYS UP WHEN YOU LONG-PRESS A MESSAGE, NEW DISAPPEARING BADGE.

            CHAT: with the keyboard open, long-pressing a message (latest or older) no longer closes the keyboard, and closing the menu no longer makes the messages jump.

            CHAT LIST: the disappearing badge hangs past the photo edge; dark mode is a dark grey disc in a black ring.

            PLEASE TEST: keyboard open, long-press the latest message, react, close; repeat on an older message; look at the badge in light and dark.

            EARLIER IN THIS ROUND (build 805): VOICE BAR NO LONGER COVERS PINNED, ATTACH SHEET BOTTOM, DISAPPEARING BADGE.

            CHATS: the playing voice note bar no longer covers "Pinned", even when it appears as you leave a chat.

            ATTACH SHEET: no white band at the bottom; the bar and Album button keep the same gap from the sheet half or full; Album from Recents opens without a slide (folders and Back still slide).

            CHAT LIST: disappearing badge is white with a black icon in light mode and black with a white icon in dark mode, icon a little bigger.

            PLEASE TEST: play a voice note, leave the chat, look at the top of Chats; open the attach sheet half and full; look at a chat with disappearing messages on.

            EARLIER IN THIS ROUND (build 804): GLOW SHEET PICTURE.

            GLOW: the "What a Glow does" sheet shows the new illustration (light mode; dark mode keeps the Glow icon for now).

            PLEASE TEST: tap Glow on someone's profile in light and dark mode.

            EARLIER IN THIS ROUND (build 803): ATTACH SHEET FIXES, VOICE BAR REDESIGN, DISAPPEARING BADGE, TWO-STEP AND FORGOT PASSWORD.

            ATTACH SHEET: the bar and Album button no longer vanish on Album or Back, no flicker when you open an album, albums slide in from the right, a fast swipe keeps the bar in place with no empty band, and the bottom corners follow the screen like Apple's sheets.

            VOICE BAR: new minimal look (play, name, speed); it no longer covers "Pinned".

            CHAT LIST: a timer badge on the photo when disappearing messages are on.

            TWO-STEP: Turn Off shows a spinner, and asks you to sign in again when needed instead of doing nothing.

            FORGOT PASSWORD: after the code you can create a new password.

            PLEASE TEST: open Album, go back, open Videos; flick the full attach sheet down fast; play a voice note and leave the chat; turn two-step off; use Forgot password.

            EARLIER IN THIS ROUND (build 802): PROFILE PHOTO NO LONGER STUCK BLURRED OR MISSING, CHAT BUTTONS IN DARK MODE, ATTACH SHEET, BLOCK NOTICES.

            PROFILE: someone's big photo no longer stays blurred. If it cannot load, their round photo shows sharp instead, and the page keeps trying. A page that opened with the grey silhouette tries the photo again before giving up.

            CHAT: after switching light/dark with a chat open, Back and the call buttons change at once, no reopen.

            ALSO: attach sheet keeps its place on a fast swipe; Fariin reaction pops like a chat; block notices stay after reopening a chat; Fariin search highlights the words.

            PLEASE TEST: open a friend's profile several times; switch light/dark inside a chat.

            EARLIER IN THIS ROUND (build 800): PROFILE PHOTOS VISIBLE TO OTHERS AGAIN.

            PROFILE PHOTO: a photo set to Everyone (nobody hidden, nobody blocked) is visible to everyone again. Open this build once so your photo is updated; people on "My Chats", Hide From or with blocked people still follow those settings.

            PLEASE TEST: open this build, then have a friend open your profile and your chat.

            EARLIER IN THIS ROUND (build 799): SEND LOCATION BUTTON, LOCATION BUBBLE, FARIIN REACTION FACE, FORWARD ROWS, ATTACH SHEET WHITE TILES.

            LOCATION: the whole Send Location button works, not only its words. The location bubble has the place and the time on one row, no empty band.

            FARIIN CHAT: your reaction shows your photo beside the emoji, like a normal chat.

            FORWARD: the chat rows on the Send to page are shorter.

            ATTACH SHEET: pulling the full sheet down no longer turns photo tiles white while they reload.

            PLEASE TEST: send a location by tapping the edge of the button; look at a location bubble; react to a Fariin post; open Forward; open the attach sheet full and pull it down slowly.

            EARLIER IN THIS ROUND (build 798): SEARCH BAR ON BACK, HEADER IN LIGHT/DARK, LAST SEEN COLOUR, FARIIN POSTS, NO EDIT ON FORWARDS.

            CHATS: the search field stays grey during the Back swipe from a chat. The header buttons and search field switch with light/dark at the same moment as the rest of the screen.

            CHAT HEADER: "last seen" takes the right colour straight after switching light/dark.

            FARIIN CHAT: no "Fariin" name inside posts, and no empty strip at the bottom of a post.

            FORWARD: Edit is no longer offered on a forwarded message.

            PLEASE TEST: open a chat and swipe back slowly; switch light/dark with the chat list and a chat open; look at a Fariin post with and without a reaction; long-press a forwarded message.

            EARLIER IN THIS ROUND (build 797): FARIIN SPACING, REACTIONS, MUTE MENU, WALLPAPER LIGHT/DARK, WALLPAPER CHATS IN LIGHT MODE.

            FARIIN CHAT: the empty space over the "Only Fariin can send messages" bar is gone. Your reaction appears the moment you tap. Profile > Mute offers 1 hour, 8 hours, 1 day, 1 week and Always, and a timed mute ends by itself.

            WALLPAPER PREVIEW: the slider is replaced by one button, top right: tap for dark, tap again for light. Your bubble shows the real chat colour.

            CHATS WITH A WALLPAPER follow the phone's light or dark mode again.

            PLEASE TEST: open Fariin and look at the bottom; react to a post; Profile > Mute > 1 hour; the wallpaper preview button; a chat with a wallpaper in light mode.

            EARLIER IN THIS ROUND (build 796): FARIIN CHAT AS A CHANNEL, TIMER ICON ORDER, NEW FORWARD SHEET, ONE-TIME VOICE PAGE.

            FARIIN CHAT: posts are wide channel cards with "Fariin" and the tick on top, pictures edge to edge, buttons as full rows, and a round forward button beside each post. The last post sits where a message sits above the typing bar. Tap your reaction to see "Tap to remove". About reads "The only official chat from Fariin".

            DISAPPEARING MESSAGES: the icon sits between the time and the tick, on every message sent while the timer is on, from the moment you send.

            FORWARD: "Send to" with Frequently contacted and Recent chats; the Forwarding preview is gone.

            ONE-TIME VOICE: opens straight to your voice bubble with its waveform, no loading.

            FORWARD: a message forwarded back into the chat it came from is a normal message, no "Forwarded" label; forwarded to anyone else it says Forwarded (text, photos, videos, voice, files, GIFs, albums).

            REACTIONS: tap a reaction, then your own row, to remove it (older messages too).

            ALL MEDIA: back and ••• follow light mode.

            PLEASE TEST: open Fariin chat and scroll to the bottom; send in a disappearing chat; wallpaper preview slider then Apply; forward a message; open a one-time voice note; forward a message back to the same person and to someone else; remove an old reaction; All Media in light mode.

