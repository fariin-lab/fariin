name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE WHOLE STORY OPEN AND CLOSE WAS REBUILT. This is the biggest change to stories since the viewer itself, so please push on it.

            SIX PLACES OPENED STORIES SIX DIFFERENT WAYS. The stories row, the ring on a chat, the archive, a contact's profile, My Story in Settings, and a reply quote each had their own open and their own close written separately. That is why a fix to one never reached the others, and why scrolling down felt like a different gesture depending on which circle you tapped. There is one now. All six go through the same code.

            THE CIRCLE IS ACTUALLY ROUND. On a chat ring and on a profile photo the story is meant to grow out of the circle and shrink back into it, Snapchat style. It was really growing as a rounded rectangle with a round picture sitting on top for the first moment. It stays round the whole way now. Cards still open as cards.

            SCROLLING DOWN HAS A LIMIT, your screenshot of the story sitting under the tab bar. It stops at about a third of the screen and will not go further or slide off the bottom.

            SCROLLING DOWN LANDS ON THE RIGHT PERSON. Open the first person, swipe to the second, third, fourth, then pull down, and it used to fly back to the FIRST one. It goes back to the person you were watching, and the row is sitting on them afterwards.

            THE WHITE CORNERS. They were in the photograph, not in the corners. When a story opens, the app takes a picture of the card you tapped, and the four corners of a square picture around a rounded card are the chat list behind it. My last two attempts tried to cover them up, which is why it got worse rather than better. They are cut out of the picture itself now.

            THE BACKGROUND STAYS DARKER while you drag, on your Telegram comparison. Not as dark as Telegram, which you said was too much. Roughly half way between, nearer Snapchat.

            ALSO: the Add button in the photo picker was a blank white pill (white text on white). The New Custom Story icon was too big next to the flame.

            AND FROM THE BUILD THAT NEVER UPLOADED: the CAMERA / TEXT bar is Signal's own control now, and the crash root cause is fixed. Apple blocked that upload, not us, so you are seeing those for the first time here.

            WHAT TO CHECK FIRST: open a story from all six places and close each one by scrolling down. Anything that feels different from the others is a mistake I made.

            STILL OPEN, do not report again yet: the story pausing by itself after you come back into the app (I asked you two questions about it), and edited videos exporting with black bars instead of the gradient.

        run: fastlane beta
