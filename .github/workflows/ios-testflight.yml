name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            DOWNLOADED STORIES SURVIVE AN APP UPDATE NOW. Story pictures and videos were being kept in the folder iOS empties whenever the phone runs low on space, and that folder is not carried across an app update - so everything you had already downloaded went back to needing the internet. They live in permanent storage with the rest of your media now, and anything already on your phone is moved across on first launch rather than lost. They delete themselves after two days, which is what Telegram uses for stories.

            THE CAMERA / TEXT SWITCH IS ONE PIECE OF GLASS. It was a glass track with a second glass pill on top of it, and two materials stacked on a black background both come out looking like grey plastic. Apple's own segmented glass has no track at all, just the selected word.

            SWIPING THE VIEWERS SHEET NO LONGER PILES THE CARDS UP. The sheet was handing the carousel a distance measured in points while the carousel was reading it as a number of cards, so a few millimetres threw the row sideways by tens of cards. Swiping the card itself was never affected, which is exactly why it only happened on the sheet.

            SQUARE AND LETTERBOXED VIDEOS GET A GRADIENT INSTEAD OF BLACK BARS. Posting one now fills the space above and below with a smooth gradient taken from the video's own colours, baked into the file so it looks the same for everyone. This replaces the blur, which had four separate ways to quietly produce nothing and fall back to black bars.

            WHAT TO CHECK: post a square video and look at the top and bottom. Then open a story you have already watched with wifi off. Then swipe the viewers sheet sideways across several of your own stories.

            ALSO IN THIS BUILD, from earlier today:

            THE STORY STAYS SOLID WHILE YOU PULL IT. It was going slightly see-through as you dragged, and with the chat list drawn right behind it even a few percent reads as glass. It is fully opaque now, the whole way down and the whole way back.

            NOTHING IS CROPPED UNDER YOUR FINGER. The picture was being shaved from the top and bottom while you were still dragging. Now the drag is a pure scale-down of the whole picture, nothing removed, and the shape only settles into the row card's shape during the snap after you let go.

            THE WHITE CORNERS ARE GONE. Our mask was drawing a plain circular corner while every card it has to line up with uses Apple's continuous curve. The sliver between those two curves was being filled with a piece of the chat list, which is what you saw as a white rind. Both shapes match now.

            YOUR OWN STORY NO LONGER SHOWS BLACK TOP AND BOTTOM. Your story sits on a full-screen black layer that other people's stories do not have, which is exactly why theirs looked right and yours did not. That black now leaves on the first frame of a pull instead of fading out over the first three centimetres.

            ROUNDED CORNERS THE WHOLE WAY, and the opening is quicker. The corner used to collapse to square whenever the card was near full screen, which is most of what you watch during an open. It now runs between the row card's corner and the story card's own, so it is round at every moment. The strip under the card that carries the reply bar is rounded too, instead of being a square shoulder under a round card.

            ADD SEVERAL PICTURES AT ONCE. Tap + in the story editor and you can now tick as many as you want. Each tick is numbered so you can see the order they will land in, a preview strip along the bottom shows what you have chosen, tapping a preview removes it, and Add brings all of them straight back to the editor. Up to ten at a time.

            WHAT TO CHECK: pull a story down slowly and hold. It must stay solid, nothing cropped, corners round from the start. Do the same on your OWN story and watch the top and bottom: no black over the chat list. Open a story and look at all four corners. Then tap + in the editor and add three pictures in one go.
        run: fastlane beta
