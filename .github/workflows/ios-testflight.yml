name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            The white lines down the left and right of a profile photo are gone. That was the blur running off the edge of the picture and averaging in nothing, so the page showed through. Worst toward the bottom, which is where you marked it.

            The pill on the All Media bar sits in the middle of its slot again instead of resting on the bottom edge, and the bar is 42pt.

            Edit Profile has Circle and Large tabs at the top. Large is a view-only preview of your big header, so you can see both crops of the same photo before you save.

            PLEASE TRY FIRST: a profile with a photo, in light AND dark, and look hard at the far left and far right edges going down past the name. Then All Media, tapping every tab.

            From 444:

            Setting a photo has TWO steps, because the circle and the big header are two different crops of the same picture. First you frame the CIRCLE, which is what shows in chats, stories, the message header and group members. Tick. Then you frame the TALL header, with the Blur band marked. Tick. Then Save. X on the second step goes back to the circle instead of throwing both away.

            Settings is back to the round picture. The big header came out as a card rather than the top of a page, with your name showing twice.

            The profile photo has no line at the bottom. It used to fade to nothing and let the page through, and a fade to nothing has a visible end. That end was the line you kept feeling. It fades into the page's own colour now, so the bottom of the photo IS the background.

            The photo is taller than the screen is wide and there is only ONE image. The blurred copy underneath is gone.

            Setting a photo changes nothing until you press Save. Pick, crop, press X and nothing happens. Remove waits for Save too.

            From 443:

            The composer rests on the safe area the way iMessage does. 442 has the 24pt version. Install both and tell me which one feels right.

            The All Media tabs float over the photos, which scroll UNDER the bar. That is what makes the glass read like the Back button's.

            From 441:

            Double tap a GIF to react. You can react to a shared location, a contact card and a poll.

            The chat list row stays highlighted while the chat is open and fades when you come back. No arrow.

            A profile no longer shows the big header for a second and then swaps to the circle.

            Profile Layout is gone from Privacy and Security. Everyone gets the new header.

            Earlier: profiles have a new top. The photo fills the whole width instead of sitting in a small circle, the name and username sit on it, and the name goes dark on a pale photo and light on a dark one. Voice, video, mute, search and more are five glass circles with no words under them. Up to three story previews sit at the top with the real number beside them. Tap the photo to open it full screen.

        run: fastlane beta
