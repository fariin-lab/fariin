name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE CAMERA / TEXT SWITCH IS APPLE'S OWN CONTROL NOW. Third try at this one, and the first two both missed the point: the material was Apple's but the control was still hand-built out of two buttons and a capsule I drew, and anything assembled by hand on a black background comes out looking like grey plastic. It is a real system segmented control, so Apple draws the glass, the sliding selection and the press.

            THE UPLOADING CARD LOOKS LIKE THE FINISHED STORY. A letterboxed video used to show black bars while uploading and then change to the gradient the moment it landed. Both pictures come from the same code now, so nothing changes colour at the hand-over. The story's own thumbnail was fixed the same way - it was made from the original clip, so the video carried the gradient and its thumbnail did not, which is why the same story showed a gradient on one card and black on the next.

            TICKING SEVERAL PICTURES WORKS AFTER A VIDEO TOO. The + button offered multi-select after a photo but not after a video. It does both now, and a mix of clips and pictures is handled in one go instead of one at a time.

            THE STORY YOU CANNOT REPLY TO NOW SAYS SO. Opening a story from someone you have no chat with left an empty strip where the reply bar goes, with no explanation. It shows a lock and a reason instead. Stories whose author turned replies off already did this; strangers were the case nobody had covered.

            THE BACKDROP FOLLOWS YOUR FINGER THE WHOLE WAY DOWN. The dimming behind a story held one fixed level for about 60 percent of the drag and only faded at the very end. It is continuous now, so the background gives way in step with the card.

            ALSO: the picker sheet no longer shows white in its top corners. The carousel card no longer catches the caption and its shadow. Chat-list story rings open on the new transition and the story lands back into the ring as a circle. Two data bugs fixed that could make a story you just deleted flicker back or one you just posted vanish for a beat.

            WHAT TO CHECK: tap a story ring in the chat list, drag it down, and watch it land back into the round avatar. Post a letterboxed video and watch the uploading card and the finished story - they should look identical. Then open a story from a test account and look for the lock instead of an empty bar.
        run: fastlane beta
