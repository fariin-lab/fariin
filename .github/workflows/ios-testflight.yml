name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE STORY OPEN AND CLOSE, second pass. Your two recordings found what the last build missed.

            A FRIEND'S STORY GROWS NOW. The last build did not fix this and I told you the reason I gave was a guess. Your recording showed it was wrong. Your story and a friend's story use two different card views, and a friend's one starts at 390 instead of 0 because it is a page controller. The code that cuts the story out of the screen added that 390 twice, so the hole it cut sat one whole screen to the right of the story. That is why a friend's story showed nothing while it flew and left a sliver stuck at the right edge when you closed it. One line.

            THE CARD KEEPS ITS BARS AND NAME WHILE YOU DRAG. They are drawn inside the card so they shrink with it, which is what Snapchat does and what makes it read as a story card instead of a photo sliding around. Only the reply bar leaves, because it sits below the card and carries a black footer that would lie across your chat list.

            THE CHAT LIST DIMS UNDER IT, up to 45 percent, like Snapchat. It fades back out just before the landing, so there is no grey to white flash at the moment the story screen goes away.

            IT IS FASTER. You timed the open at 0.51 seconds and you were right, the maths said 0.50. It was a spring chasing its last one percent long after the eye was done. It now runs Signal's own story spring and finishes in about 0.3 seconds, which is what Signal's transition costs. Opening and closing use the same spring, so they take the same time.

            WHAT TO CHECK FIRST. Open a friend's story from the top row: it should grow out of the card now, not appear. Close it: it should shrink back into that same card, not leave anything at the right edge. Then drag one down slowly and watch three things at once - the bars and name stay on the card, the chat list behind goes darker, the reply bar is gone.

            STILL OLD BEHAVIOUR ON PURPOSE: opening a story from a profile, from the ring next to a chat, or from the archived page. Those still use Apple's transition, which shrinks the whole screen instead of the card. They are next if you want them.
        run: fastlane beta
