name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            PLEASE TRY THESE FIRST. Watch a story with a video in it, on wifi and on mobile data. The app was crashing there and only a real phone can tell us it is gone. Then post a video story with text on it, with the pen on it, and cropped, and check the words land where you put them.

            THE CRASH IS FIXED. When a story video started downloading, one line assumed the connection would always ask us the same question, and on networks that ask a different one the app closed itself. That happens on hotel wifi, on some phone networks, and behind a work connection. The same line was also accepting any security certificate it was handed without checking it, which it should never have done.

            MESSAGE REQUESTS. Somebody who has never messaged you now gets one message and then waits. You see Accept or Delete inside the conversation itself, not in a separate inbox you have to go and find. Accept and you are friends and can talk normally. Delete and it is gone. Their first message is limited to 300 characters so an unanswered request cannot be used to shout at you.

            Who can message you is Everyone or My Friends. My Friends means people you have already accepted. There is no No One option, as you asked.

            AA, CROP AND PEN NOW WORK ON VIDEOS. They were on the screen before and then quietly thrown away when you posted, so the video came out plain. Now they are painted into the video itself.

            THE VIDEO EDITOR HAS THE PLUS BUTTON AND THE THUMBNAIL STRIP, like the photo one. Add several videos to one post, tap between them, and each one keeps its own trim, its own mute and its own drawings. Trim them all from the same trim screen instead of going in and out for each one.

            USERNAMES TELL YOU AS YOU TYPE. It says Checking username, then either that the name is available or that it is already taken, and it fades between them instead of jumping. There is a small X in the field to clear it. The important part is underneath: the server now decides who gets a name, in one step, so two people tapping Done at the same moment can no longer both be told they won.

            A VIDEO ADDED IN THE PHOTO EDITOR shows a play mark now. It shows a still picture there, and without the mark you could not tell it was a video until after you posted it.

            WHAT TO WATCH FOR, and please tell me if you see it. Nothing that already worked should have changed: open your old chats and check none of them are asking to be accepted. Open a group. Send a normal message. Post a plain video story with no drawing on it, which still goes out the old way untouched.

        run: fastlane beta
