name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            ATTACH BAR STAYS, OFFICIAL CHAT LAST MESSAGE, LONG PRESS ON BUTTONS, DISAPPEARING ICON, ALL MEDIA BUTTONS.

            ATTACH: the Camera/GIF/Files/Location bar no longer disappears when you tap the Album button or its back arrow. Scrolling right after opening the sheet moves the sheet, with no black band at the top or bottom.

            OFFICIAL CHAT: the last message stops above the "Only Fariin can send messages" bar.

            LONG PRESS: works on messages that have a button (for example "Review Devices").

            DISAPPEARING MESSAGES: every message sent after you turn it on shows the timer icon beside the time (it used to show a small circle on only some). A reaction no longer runs into it.

            ALSO: the time on photos and GIFs is centred in its pill; All Media's back and ••• buttons are light in light mode.

            PLEASE TEST: tap Album and back in the attach sheet; open the sheet and scroll at once; long-press the Review Devices message; send messages in a disappearing chat and react to one; open All Media in light mode.

            EARLIER IN THIS ROUND (build 793): NEW ATTACH SHEET, OFFICIAL CHAT FIXES, REACT WITH THE KEYBOARD UP, BLOCK NOTICES.

            ATTACH: the + grows into the sheet and the sheet shrinks back into the + (the + stays centred). Tapping during the animation turns it around. The sheet floats with space on the sides and bottom, and pulling the photos down no longer shows a black gap. The Album button is a normal colour.

            OFFICIAL CHAT: Search works inside the chat like a normal chat. Reactions use the normal chip. The last message no longer hides under the bottom bar. Mute and Search sit closer together, and About is one short line.

            REACT WITH THE KEYBOARD UP: long-pressing a message keeps the keyboard open and the menu opens above it.

            REACTION BAR: the swipe row holds 15 emojis; tap + for all the others.

            BLOCK: "You blocked this person." and "You unblocked this person." show in the chat, only to you.

            ALSO: the time on photos and GIFs is centred in its pill; the disappearing-message notice is no longer cut; All Media, Chat Key, Message Requests and Archive have a light top bar in light mode; the pin bar has the new pin icon.

            PLEASE TEST: open and close the attach sheet many times, pull it up and down; with the keyboard up, long-press and react; block and unblock someone; search in the Fariin chat.

        run: fastlane beta
