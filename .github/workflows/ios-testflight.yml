name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            PLEASE TRY THIS FIRST. Settings, Account, Sign-in Methods. If you have two logins connected, each one now has a Remove button. Tap it and check three things: it tells you what you will still be able to sign in with, it makes you sign in again before it does anything, and you get an email afterwards saying a login was removed.

            YOU CAN TAKE A LOGIN OFF YOUR ACCOUNT NOW. Adding one used to be permanent. That was the worst hole in the app: somebody holding your unlocked phone could attach their own Google account to your Fariin and sign in as you forever, and nothing anywhere could undo it. A password you can change. That you could not.

            Two rules keep it safe. You can never remove the last one, because that would leave an account with no way in. And it always makes you prove it is you first, even if you just signed in a minute ago. That second rule matters more than it looks: without it, the same person holding your phone could connect their login, remove yours, and lock you out of your own account.

            YOU NOW GET AN EMAIL when a login is added OR removed, including when you are the one doing it. It names the login, the account, the time, and what ways in you have left.

            AN ALBUM WITH A VIDEO IN IT no longer draws the play button on top of the upload spinner. They came from two different places and overlapped into one broken smear while sending. The play button now waits until the album has finished going out, which is also more honest, since it cannot be played yet.

            THAT ONE IS TEMPORARY, on purpose. The real fix is a progress ring on each item that fills as it uploads, that you can tap to cancel, the way WhatsApp does it. That is the next piece of work. Right now an album reports no progress at all, which is why the spinner spins instead of filling.

            STILL MISSING, so you do not go hunting. Announcements make no sound at all, not even security ones. Cancelling a send only hides the bubble, it does not actually stop the upload yet.

            WHAT TO WATCH FOR. Nothing that already worked should have changed. Send a photo. Send a video. Forward an album with photos and a video mixed together and check it arrives in the SAME ORDER you sent it. Open your old chats. Open the Fariin chat.

        run: fastlane beta
