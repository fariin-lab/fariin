name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            FIVE FROM YOUR LIST TODAY. The skeleton fix you asked about again was already in 750, so check that one here too.

            THE LINE UNDER THE HEADER IS GONE, and this is the fourth try so please look hard at it. It was never the header. It was the SEARCH BAR drawing its own background with its own line along the top edge, which is why three fixes to the header all missed. Your answer about where the line sat is what found it.

            THE ADD STORY CARD WEARS YOUR PROFILE PICTURE. It was always being handed your photo, which is where the little round face at the bottom comes from, and it was throwing it away and painting grey behind it. With no photo set it still shows the plain grey card.

            NO MORE "CONNECTING" ON GOOD WIFI. The phone reports a network change for things that are not problems at all, a wifi roam or waking from lock, and the app used to announce Connecting two and a half seconds later purely because nothing had arrived in that window. On an app that synced minutes ago nothing is going to arrive, because there is nothing to send. It now actually asks the server and only says Connecting if that fails.

            WALLPAPER PREVIEW IS A SHEET, with a Preview title and the X in the corner, instead of taking over the whole screen. I did not add a Set button, because yours says Apply For All Chats and that means something Set does not. Tell me if you would rather have Set.

            REACTIONS. I read the reference app's source for this one. Four things were wrong together: on your own message the pill now sits on the RIGHT where theirs does, instead of tucked into the far bottom corner; the pill is taller and roomier and the emoji is bigger, all their measurements; the colour comes from the bubble it sits on, so it stops looking pasted onto your chat colour; and the bright ring around it is gone, because they show "you reacted" with a stronger fill and no outline.

            STILL NOT FIXED, ON PURPOSE: closing a photo does not return it to its bubble. Two fixes have already been shipped for that and it came back, so I want to measure it on your phone rather than guess a third time.
        run: fastlane beta
