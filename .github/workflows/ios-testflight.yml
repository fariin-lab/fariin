name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE PICTURE THAT FLIES WAS BLANK, AND NOW IT IS NOT. That is why the preview only ever changed after the card had landed: the app was photographing an empty frame instead of the card, so there was nothing to cross-fade with and the real card had to snap in at the very end. It photographs the card itself now.

            THE EXCHANGE HAPPENS ON THE WAY HOME, not under your finger. Three clean phases: while you drag, the story you were watching stays exactly as it is, nothing swaps. The moment you let go, the flying card cross-fades into the row picture, avatar ring and border and all, over the snap. It is finished at four-fifths of the way down, so the last stretch is already wearing the row card and the hand-over at the end swaps two identical pictures.

            THE TOP AND BOTTOM STOPPED POPPING IN. The black above and below the card, the reply bar and the footers now fade with the card's own travel instead of switching on when it stops.

            VIEW ONCE ACTUALLY ENDS NOW. The server piece that was meant to drop you from a one-time story after you finished it did not exist, so those stories stayed in the tray and could be reopened. Fixed on the phone in this build; the server half goes up separately.

            POSTING THREE PICTURES SHOWS THREE. Each post in the air gets its own card with its own progress, so you can page between them instead of seeing one upload repeated.

            ALSO: the audience line (My Friends, Everyone, a custom list) is yours alone now and nobody else sees it, and a story posted to a custom list no longer says My Friends while it uploads. Video captions sit inside the picture like photo captions do. The CAMERA / TEXT switch is real glass that melts from word to word. Can't Call now speaks straight away when you press call on a profile.

            WHAT TO CHECK, slow motion welcome: pull a story down slowly and hold. Nothing at all should change while your finger is down. Let go, and watch the picture become the row card during the flight. When it lands there must be zero change: no jump, no flash, no avatar appearing late. Then post one story to a custom list and watch what the uploading card says, and finish a view-once story and try to open it again.
        run: fastlane beta
