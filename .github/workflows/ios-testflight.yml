name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THIRTEEN CHANGES SINCE YOUR LAST BUILD. The big one is the story freezing, and it turned out not to be the pause at all.

            THE STORY THAT OPENS ALREADY STOPPED IS FIXED, AND IT WAS NEVER A PAUSE. The progress bar has a second brake on it, meant to hold the bar still while a story is sliding sideways between people. It works out whether the story is sliding by asking where the story sits on the screen, and that answer is only refreshed when the story changes SIZE, never when it MOVES. So if the app happened to ask while the story was flying out of the little card, or while it was halfway to the next person, the answer was "still sliding" and it stayed that way for the whole visit. That is why it froze the instant you opened it, and why walking to the next person froze that one too. The brake now only applies to a story that is not the one you are watching, and it is rechecked twenty times a second, so it cannot stick again.

            The earlier pause work is still here and still right on its own: a tap no longer pauses the story, only a real hold does. But it was not what was freezing you, so please do not judge it by that.

            YOUR PROFILE PAGE CAN TAKE ITS COLOURS FROM THE PHOTO, AND IT IS OFF UNTIL YOU TURN IT ON. Settings, then Privacy and Security, then Adaptive Profile Background. On, and the page behind a person takes the colours of their own photo all the way down the screen, with the cards on it turned to glass. Off, and you get exactly the page you have today. A profile with no photo is unchanged either way. Groups and your own settings page are not in this yet.

            THE LONG PRESS ON THE STORY ROW OPENS AND CLOSES LIKE TELEGRAM. Read out of Telegram's own code, not guessed. The menu grows out of nothing and is solid almost at once instead of fading in, and the close is a fifth of a second of plain movement with no spring at all, where ours took twice as long and bounced as the card landed back in the row. The design is untouched. The chat's long press menu is not changed in any way.

            ALL THE VIEWER CARDS KEEP THEIR BLUR. Only the centred card was blurred, because iOS silently drops a blur on any card drawn even slightly faded, which is every card except the middle one. They use a ready made blur now, so they all match. This was written two hours after your last build went out, which is why you saw it again this morning.

            A VIDEO REMEMBERS WHERE IT WAS. Watch to 20 seconds, scroll up, swipe the carousel, come back, and it carries on at 20 seconds instead of restarting. The progress bar resumes with it.

            THE NAME UNDER A CARD NO LONGER DISAPPEARS. When a story opened, the whole card was hidden, name included, and the name only came back once the story finished closing. That is your "name is coming late". Only the picture steps aside now, so the name never leaves.

            OPENING FROM A CHAT RING IS A REAL CIRCLE. It used to grow a circle wider than the card, so the card's own edges cut the sides flat, which is your "left and right feeling cut". The circle becomes the card now instead of outgrowing it. The story screen's header and reply bar also stop being drawn in a rectangle around the circle, which is the mirror effect you circled.

            SCROLL DOWN STOPS SOONER. Measured off your two screenshots: the card you called too far is 22% of the screen and the one you wanted is 46%, so that is the new limit, and the drift past it is more than halved.

            SWITCHING TO THE NEXT PERSON IS FASTER. The next person's screen is built and laid out while you are still watching the current one, so the tap does not pay for it.

            ALSO: the caption hides as soon as you start pulling down. Long pressing a name shows plain text with no white box behind it, and the name is no longer on screen twice as the card flies back. The archived page uses the app's own long press menu instead of Apple's. The black bars at the top and bottom of your own story are gone.

            WHAT TO CHECK FIRST: open a story and watch the bar move straight away, then go to the next person and watch it there too. That is the freeze. Then long press a story card and close the menu, and tell me if the close still feels wrong.

            STILL OPEN: edited videos still export with black bars instead of the gradient.
        run: fastlane beta
