name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            A round of fixes from your own reports, plus the profile icons you sent. Verified to build, not tested on a phone, so please be rough with it.

            THINGS THAT DID NOTHING WHEN TAPPED
            In the photo viewer, Save Image, Share and the pen all work again. They were reading the photo from the wrong place, so on a picture that was already loaded they quietly did nothing while Delete kept working.

            PINS
            Deleting a pinned message now clears the pin bar. Delete for Everyone already did this; Delete for Me left a dead "Tap to view" pin behind. Your pin disappears without touching the other person's.

            BUBBLES AND SPACING
            A message no longer cuts off with dots when there is clearly room below it. Sending a file no longer makes its bubble jump size when the upload lands, and an uploading PDF now shows its page straight away. Sending a reply no longer leaves a gap between the message and the keyboard; cancelling always worked, sending did not.

            LOOK AND FEEL
            The long-press blur now closes exactly like Signal, as a plain fade rather than riding the spring, and the lifted message drops no shadow on iOS 26 the way Signal does. On the profile, the Notes card's More now sits at the end of the second line instead of taking a third. New icons for Verify Encryption, Disappearing Messages, Change Wallpaper, and Sounds and Notifications now matches the Settings one.

            PLEASE TRY on the 13 Pro Max especially: send a long message and check it wraps instead of showing dots; send a file and watch the bubble while it uploads; reply to a message and send it, then look at the space above the keyboard; pin a message then delete it; open a photo and tap Save, Share and the pen.
        run: fastlane beta
