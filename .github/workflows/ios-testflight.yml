name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE SWIPE TO THE NEXT PERSON IS BACK. I BROKE IT IN THE LAST BUILD. In trying to make stories open faster I attached the pager one step earlier, and at that moment the app does not yet know how many people have stories. It read "only one" and switched the sideways swipe off for the whole session. The early attach is reverted, and the switch now turns back ON as well as off, so a wrong answer that early can never stick again. Stories still open faster than before, just not by quite as much.

            THE VIDEO NO LONGER BLINKS BLACK WHEN YOU TAP ACROSS TO IT. Two separate faults in your three screenshots. The player was looking for the cover in its own caches, and the app keeps them in a different one, so for a story you just posted it had nothing to draw and showed black. And the clip was uncovered the moment it started playing, which is before it has told anyone its shape, so it painted once at the wrong size and corrected itself. It now waits for both.

            THE CAPTION AND ITS SHADOW WHEN YOU SCROLL UP. You told me to go and read Telegram and I did. Their caption's transparency is multiplied by the same number that shrinks the card, in the same pass, so it cannot disagree with the card. Ours was three separate messages and any one of them arriving late left the caption on screen. It now reads the shrink itself. NOTE: if the text you saw sits in the corner of a TikTok clip, that is burned into the video and no setting can remove it. To tell: post a story with no caption at all and scroll up. If text still shows, it belongs to the video.

            A STORY FROM THE CHAT ROW OPENS LIKE ANY OTHER NOW. It grew out of the circle as a circle; it grows as a card. It still becomes a circle on the way back, which is what you asked for and what Snapchat and WhatsApp do. That circle also lands about three times sooner: the number that controls it looked like 15 per cent of the drag but was really 24 per cent of the distance your finger travels, which is the lateness you described.

            SEND AND PREVIEW NOW APPEAR INSIDE AN ALBUM. The bar was built into the first screen, and an album opens on top of it, so it was left behind. Your selection was never lost, which is why the numbers were right and only the buttons were missing.

            SCROLLING DOWN OUT OF AN UPLOADING STORY NO LONGER SHOWS BLACK AT THE TOP AND BOTTOM. Every other door hands the story straight to the viewer. The uploading one put a full-screen black sheet behind it, to stop the picture blinking when the upload finishes and the real story takes over, and nothing could clear that sheet while the card shrank away from it. It still holds still at rest, and now steps aside for the moment the card is in the air.

            THE PICTURE ON THE SETTINGS PAGE IS BIGGER. 120 instead of 96.

            WHAT TO CHECK FIRST: swipe sideways between people, then tap left and right onto a video.

            STILL OPEN: edited videos still export with black bars instead of the gradient.

            PREVIOUS BUILD, STILL WORTH CHECKING: the blur behind a story was replaced with Telegram's gradient, and photos that do not fill the frame are now posted as a full frame. Square photos and square videos are the test.
        run: fastlane beta
