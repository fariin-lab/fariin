name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            A big one. Most of this is invisible plumbing for bad connections, plus deleted messages now leave a mark instead of vanishing. Verified to build and unit tested, but barely tested on a phone, so please be rough with it.

            DELETING A MESSAGE
            Deleting for everyone now leaves "This message was deleted" instead of the message silently disappearing, the way WhatsApp does it. Delete that marker again and it goes too, for you or for both of you. If you deleted something and tried again because you were not sure it worked, it no longer lies and says the server refused. And a message you deleted no longer stays readable inside anyone's reply to it, which it did before.

            WEAK SIGNAL
            Photos and videos no longer give up the moment you walk into a lift. They wait for the signal and carry on. A failed upload now retries itself instead of failing the whole send, and it keeps going for a while after you leave the app. Calls carry redundancy so one lost packet stops punching a hole in the audio, and they use much less data while nobody is talking. On a 1 to 1 video call, if the line gets too weak the video pauses on its own and says why, then comes back when the line holds. Group video now steps down through three quality levels instead of stalling.

            FORWARDING
            Forwarded photos and messages appear instantly in the chat you send them to, instead of you landing there and watching an empty space while it uploads.

            SMALLER THINGS
            Pasting a link shows its preview straight away. Sending a file no longer makes the bubble jump size when the upload lands. Photos you send and receive are now kept on your phone properly, which is groundwork for cutting our server costs later.

            PLEASE TRY: delete a message for everyone and check it leaves a mark, then delete the mark; reply to a message then delete the original; forward a photo to someone and watch the chat you land in; send a photo with the phone in airplane mode then turn it off; paste a link in the box; make a video call somewhere with bad signal.
        run: fastlane beta
