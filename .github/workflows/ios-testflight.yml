name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THE STORY OPEN AND CLOSE, and where a story starts. Four things, all from tonight's reports.

            YOUR OWN STORY NO LONGER CLOSES ONTO A BLACK SCREEN. Only your own story had a full black layer sitting behind it, which is why a friend's story showed the chat list behind it and yours did not. It is a SwiftUI layer behind the card, and the card is moved in UIKit, so the card flew home over a black wall and the chat list only came back once the screen was gone. It now steps aside for the flight. The Views and delete bar goes with it, because on an X close it was hanging there as a black bar.

            A FRIEND'S STORY GROWS OUT OF ITS CARD INSTEAD OF POPPING. The animation waits for the card's real position and used to give up after a quarter second. Your own story hands that over before the first frame is drawn. A friend's cannot, because that screen builds a page controller and a fresh page at the moment you tap. Past the deadline it just showed the story at full size. It now waits while that screen is genuinely still building.

            CLOSING LANDS ON THE RIGHT CARD. The row re-sorts itself the moment you finish someone's last unwatched story, so their card slid to the watched group while you were still inside the story, and the close chased it towards the edge of the screen. The row now holds still while a story is open and re-sorts after you leave.

            WHERE A STORY STARTS, which is what you asked about. Three rules, in order. Where you left that person, if you were already in them this time. Otherwise their first unwatched story. Otherwise, if you have watched everything of theirs, the direction decides: going BACKWARDS lands on their newest, going forwards lands on their oldest. That last part is Signal's rule, read from their source, and it is what you described. It used to be one answer for every case, always the oldest, which is why everything restarted from the beginning.

            WHAT TO CHECK FIRST. Open your own story and drag it down slowly. The chat list should be behind it the whole way, no black. Then close with the X, same thing. Then open a friend's card and watch whether it grows out of the card or appears at full size. Then watch someone's last story to the end and close, and see where it lands. Then tap back past the first story into someone you have already watched, and you should get their LAST one, not their first.

            ONE THING I AM NOT SURE OF: the friend's story growing out of its card. I found a real difference between the two screens by reading the code, but I could not measure it. If it still pops open, tell me and I will find which measurement is missing instead of widening the wait again.
        run: fastlane beta
