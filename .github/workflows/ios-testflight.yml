name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            NO MORE DEBUG BOXES, VIDEO NO LONGER FREEZES, LIGHT-MODE CHATS BAR.

            DEBUG BOXES: the red server box and the black timing box are gone. Nothing about sign-in, tokens or timing shows in the app any more.

            VIDEO: pulling a video down and letting it spring back keeps it playing (it used to freeze on one frame), and the viewer comes back fully, never see-through over the chat.

            LIGHT MODE: after you open a chat and go back, the Chats bar (Edit, the buttons on the right, the search field) is light again instead of dark.

            PLEASE TEST: in light mode, open a chat with a wallpaper and go back to Chats. Open a video, pull it down a little, let go so it springs back. Use the app normally and check that no box appears.

            EARLIER IN THIS ROUND: THE APP HEALS ITSELF WHEN THE SERVER REFUSES IT, VIDEO WITHOUT THE BLACK SCREEN, CHAT OPENS DRAWN, VOICE TIME.

            SERVER REFUSED: when the server refuses the phone for a moment (the "everyone looks deleted, nothing sends" problem), the app gets a fresh sign-in and reconnects by itself within about a minute. Profiles keep their last copy instead of going blank.

            VIDEO: the picture that flies in stays on screen until the video's first frame, so there is no black screen.

            CHAT OPEN: the chat slides in with its messages already drawn.

            VOICE: the time on a voice message counts while it plays and no longer shows "0:...".

            EARLIER: select-mode lines, header text colour, gradient bubbles, a freeze when opening a chat, bubble colour after a wallpaper change, reaction jumps.

            EARLIER IN THIS ROUND: PHOTO AND GIF REACTIONS AND TIME.

            REACTIONS ON PICTURES: a smaller reaction sits on the picture's bottom-left edge, so it is clear which picture it belongs to.

            TIME ON PICTURES: the time and tick are centred in their dark capsule, and the tick is fully white.

            PLEASE TEST: react to several photos and GIFs in a row; look at the time on a photo you sent.

            EARLIER IN THIS ROUND: REACTIONS, HEADER BLUR, AUTO COLOR, WALLPAPER SHEET.

            REACTIONS: reacting no longer drops the chat down and brings it back; a new reaction appears in place, not over the message below.

            HEADER: opening a chat, the blur under the header is there while the page slides in.

            AUTO COLOR: Auto is always one flat color that matches the wallpaper.

            WALLPAPER SHEET: the selection ring moves to the wallpaper you tap straight away.

            PLEASE TEST: react to the last message and to a photo; open a few chats and watch the header; try Auto on different wallpapers.

            EARLIER IN THIS ROUND: SELECTION, ARCHIVE AND FAILED MESSAGES.

            SELECTION: the delete button works even when a call is selected; no empty circles stay behind after you cancel.

            ARCHIVE: an archived chat fades out instead of sliding under the Pinned heading.

            FAILED MESSAGE: tapping the red (!) opens Resend / Delete right next to it.

            PLEASE TEST: select messages including a call and delete them; select and cancel; archive a pinned chat; tap a failed message's (!).

            EARLIER IN THIS ROUND: PHOTO REACTIONS, ALL MEDIA SPEED, RESET MENU, SELECTION.

            PHOTO REACTIONS: a reaction on a photo or GIF sits under the picture with the person's face, and no longer covers the time.

            ALL MEDIA: swiping between Media, Files, Voice, Links and GIFs is smooth in chats with a lot of media.

            RESET: Settings > Set Wallpaper and Chat Color have a new ... menu (top right) to reset the wallpaper or the chat color, for Settings or for every chat.

            SELECTION: selecting messages no longer flashes the back button.

            PLEASE TEST: react to a photo; swipe through All Media in a busy chat; try the ... reset menu; select several messages.

            AUTO COLOR: the first circle in Chat Color is now Auto. On Auto, your bubbles take the matching color of the wallpaper; a color you pick yourself is never changed by a wallpaper. Reset in the chat wallpaper sheet can reset the chat color or the wallpaper; Settings > Chat Color has Reset All Chat Colors.

            WALLPAPER: a chat with its own wallpaper keeps it when you change the wallpaper in Settings. In the chat wallpaper sheet, the color row no longer jumps over the wallpapers.

            REACTIONS: even spacing around the heart and the avatar in a reaction pill.

            PLEASE TEST: set a chat to Auto and try different wallpapers; give one chat its own wallpaper, then change the one in Settings; react to a message.

        run: fastlane beta
