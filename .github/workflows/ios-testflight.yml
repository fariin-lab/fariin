name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            EVERY REPORT FROM TONIGHT IS IN THIS BUILD. In your order:

            CLOSING THE SHEET CANNOT CLOSE THE STORY ANY MORE. Your screenshot: dragging the viewers sheet down dragged the whole story page with it. I had asked Apple's page-close gesture to wait its turn and your phone proved it does not wait. Now the moment the sheet opens, that gesture is switched off completely, and it comes back the moment the sheet closes. Scroll down with the sheet open and only the sheet moves.

            THE BLACK HEADER ON STORY CLOSE, FIXED FOR REAL THIS TIME. My earlier fix waited for Apple to announce the close, but the zoom shrink starts before that announcement ever comes. Now the black steps aside the instant your finger starts the downward drag, so what pulls away is the picture alone, like Telegram.

            VIDEO STORIES POST AGAIN. This one was the server: it only accepted photo files for stories, refused every video's files by name, and the app then deleted its own half-made story. That is why a video uploaded fully and never appeared. Fixed on the server an hour after your report, so it also works on the old build.

            ZOOMED-OUT STORY PHOTOS POST LIKE TELEGRAM. Pinch a photo smaller and post: the story is now baked as one full frame, your photo over a soft dark blur of itself. No more smeared side bands invented at watch time.

            THE CARDS ROW RUNS ON TELEGRAM'S ENGINE. Read from their code: a real scroller's physics drives the row, so the swipe follows your finger, glides with native momentum, and snaps to a card. The story swap under the card happens exactly when the row stops. Tap a side card and it glides over; tap the middle card and the sheet closes.

            SWIPE THE SHEET SIDEWAYS. With the viewers sheet open, drag it left or right and it slides to the next or previous story's own sheet, Telegram's exact thresholds, while the cards row and the story behind follow. At the ends it rubber-bands.

            THE SHAKING BLUR ON VIDEOS IS GONE. The loading veil over a video was a live blur that trembles while the card scales. It is a frozen image now and moves as one piece with the card.

            THE COMPOSER RESPECTS YOUR PICTURE. The tool capsule and NEXT no longer sit on the photo: the canvas ends above the bar now, so a tall photo shows as the boxed card with the controls on black. While you are zoomed into an image, a sideways swipe pans the picture and never flips to the next one; the thumbnails are how you switch. The photo picker from + is always dark like the rest of the story screens. A chosen video can never vanish silently again, and the trim screen no longer shows two X buttons stacked in a corner.

            WHAT TO CHECK, IN ORDER. Sheet open: drag down, the story page must not move. Sheet open: drag sideways to the next story's sheet. Friend's story: drag down, no black band at any speed. Post a video story, then a zoomed-out photo story. Cards row: slow drag, hard flick, tap a side card. Composer: tall photo, check the buttons sit on black; zoom in and swipe; + then video.

        run: fastlane beta
