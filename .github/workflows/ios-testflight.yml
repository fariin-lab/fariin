name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            PLEASE TRY THIS FIRST. Open the app and look at your chat list. There should be a new chat called Fariin with a blue tick, at the top. Open it. The bell at the top right should ALREADY be crossed out without you touching it, and there should be no box to type in at the bottom, only a line saying only Fariin can send messages. If any of those three things is wrong, tell me.

            THE OFFICIAL CHAT. This is where we tell you about new things, fixes and updates. It works the way Signal's does, and the important part is what is NOT there: no account sits behind it. There is no @fariin user to log in to, so nobody can ever pretend to be it. The app itself decides what is official, and the tick is drawn from that and nothing else.

            It is muted from the start and stays muted unless you turn it on. You can block it and you will stop getting updates, and nothing is lost if you unblock it later.

            SENDING ONE, for you only. Settings now has Official Announcements, and only your account can see it. Please test it on yourself first: New Announcement, then Send to, then Chosen people, then pick yourself. Nobody else sees that. Write a title, write a message, add a picture, add a button, and send. Then open the Fariin chat and check it looks the way the preview said it would.

            When you are happy, Send to Everyone is the same screen. You can also send to particular countries, or to a share of people rather than all of them, and you can set a date instead of sending now.

            You can add other admins in there too, and choose one by one what each of them is allowed to do. Only you can do that, and nobody can be made an owner.

            WHAT I KNOW IS MISSING, so you do not go looking for it. Announcements do not make your phone buzz at all, not even the security ones. The chat is muted on purpose and there is no notification behind it yet. That is a separate job and I have not started it.

            The Update Now button needs the App Store link, which cannot exist until the app is published. Until you set it in Announcements, Update Link, the app refuses to offer that button rather than giving you one that opens nothing.

            WHAT TO WATCH FOR. Nothing that already worked should have changed. Open your old chats. Send a normal message. Post a story. Swipe the new Fariin chat to pin, mute and archive it and check each one actually holds.

        run: fastlane beta
