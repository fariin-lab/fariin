name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            EVERYTHING YOU REPORTED SINCE THE LAST BUILD, plus a crash fix. Twenty one changes.

            A CRASH IS GONE, and you could hit it. Opening My Friends under Stories and touching Allow Replies and Reactions killed the app. The two built-in audiences carried a date two days below the earliest one Firestore accepts, and it does not return an error for that, it raises. Found from your crash log, symbolicated against the exact build.

            + THEN CHOOSE AN IMAGE WORKS. The editor keeps its tools beside the picture rather than inside it, and adding a picture restored everything except the tools - so a new photo arrived wearing the last one's crop, and if that one had been cropped you were shown the OLD photo. The picker also closes when you pick now.

            AN UPLOAD THAT CANNOT FINISH NOW FAILS. Firebase retries a dead upload for TEN MINUTES before giving up, and the card that says Uploading is cleared by the code that runs when it gives up. Capped at two minutes. Expect a story on a bad connection to fail visibly now instead of spinning forever.

            THE STORY CARDS. Video cards went black after a swipe: the picture I take of the card does not always capture video, and a failed capture was being kept. Blank ones are thrown away now. A square video keeps its blurred bars after posting, second attempt. The row and the sheet swipe together - 10 percent of one is 10 percent of the other.

            TAP TO THE NEXT PERSON IS FASTER. Half a second of animation that animated nothing is gone, and the next person's screen is no longer built from scratch during your tap. Some delay remains and it belongs to iOS.

            CUSTOM STORIES. The sheet grows with your list instead of cutting off the fourth row. Everyone wears your profile picture. Five is the limit and the button says so. New Group Story is hidden until it exists.

            THE EDITORS. The video editor uses the photo editor's exact frame, so buttons no longer sit on the video. Its caption sits where the photo editor's does. The video opens PAUSED. X and speaker are 40pt. The caption + is your own icon on both. The picker is one colour, not a lighter bar over a darker list. The CAMERA and TEXT switch no longer jumps sideways.

            WHAT TO CHECK FIRST. Settings then Stories then My Friends, and hit the replies switch - that is the crash. Then + another image in the editor. Then post a story on a weak signal. Then a square video, and swipe between video cards.

            ONE THING I COULD NOT TEST: the square video blur is my second attempt at a bug I cannot reproduce on a simulator. If it is still black, tell me and I will bake the blur into the video at post time instead.

        run: fastlane beta
