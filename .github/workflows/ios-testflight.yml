name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            EVERYTHING YOU REPORTED TODAY IS IN THIS BUILD, plus a new privacy system. Nothing here has been on a phone before, so treat all of it as untested.

            STORY PRIVACY AND CUSTOM STORIES, NEW. Who can see your story is a list of audiences you make once and reuse now, not three buttons you answer again every time. Everyone, My Friends, and any custom story you build. Plus New makes another one without leaving the post: pick people, name it, done, and it is selected for you. Settings then Stories shows the same list, so one you made while posting is there afterwards and one you made in Settings is there next time you post. Each list has its own replies and reactions switch. Editing or deleting a list can never reach a story you already sent. Everyone means anyone who opens your profile can watch, while people you have chatted with also get it in their tray. It is not a feed. Group stories are next; the menu shows it greyed.

            THE SHEET DRAG CANNOT CLOSE THE STORY. Your screenshot again. The page close belongs to Apple and the old fix argued with its gesture, which is why it only went wrong sometimes. The presentation is simply told to stand down while the sheet is up, and asked before it will start, so there is no race left.

            SWIPING THE SHEET SIDEWAYS SHOWS THE NEXT SHEET STRAIGHT AWAY. It used to slide out, then switch, then slide back, so there was black behind your finger the whole way. Both move together now and the one arriving carries the real list. The cards row also moves the same distance your finger does; it was crawling at half speed because of a unit mistake.

            THE PHOTO FILLS THE CARD. The blurred strips down the sides of your story were the viewer measuring your photo against the phone instead of against the card. Measured off your own posted file. The composer was also framing for a slightly different shape than the story, so it now uses the story's exact rectangle. The preview card is about 18 points shorter as a result. That is the part that never fitted.

            A VIDEO STORY KEEPS ITS FRAME. Swipe between stories and the video card holds the frame you were watching instead of jumping back to the first second. A square video also keeps its blurred bars after posting instead of turning them black.

            THE CAMERA. Hold to record starts immediately: the microphone was being attached at the moment you pressed, which stalls the camera. Flash now works for video, which it never did, because video needs the lamp and nothing ever switched one on. The flash button goes yellow when armed and is hidden on the selfie camera, which has no flash.

            SMALLER THINGS. The picker is one theme now, not a white bar over a dark grid. The upload ring keeps spinning through Adding instead of vanishing halfway. The caption sits lower, and fades away as you pull the sheet up. Crop opens the way trim does, the picture zooming out first. The video editor uses the photo editor's exact frame, so the buttons no longer sit on the video. The text story button is a round arrow and the camera and text switch is real glass.

            WHAT TO CHECK, IN ORDER. Post a story and try the audience list, make a custom story, then check it again in Settings. Open a story, pull the sheet up, drag it down, the story page must not move. Swipe the sheet sideways. Post a photo and look for strips down the sides. Post a square video and look at the bars. Hold the shutter and let go quickly. Turn on flash and record in the dark. Flip to selfie and the flash button should go.

        run: fastlane beta
