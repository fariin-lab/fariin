name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            PLEASE TRY THIS FIRST. Send a long video. 20 seconds, 30 seconds, the longest one you have. It should go. If it fails, tell me the sentence it shows you.

            THE VIDEO FAILURE IS FIXED, AND I HAD THE REASON WRONG THREE TIMES. I blamed the upload, then the app and server disagreeing about the size limit, then the High quality setting. You showed me Standard was already selected, so none of that was it. The actual answer only turned up when I stopped reasoning and went and measured the real files sitting in storage: a 540p video was coming out at 19.27MB. Quality settings are a suggestion to the compressor, not a limit. They do not cap anything. There is a separate setting that is an actual hard ceiling on the finished file and we were never using it. Now we are.

            So the size is the thing being controlled now, not the resolution. A long video gets compressed harder to fit rather than coming out too big and being refused at the end.

            THE FARIIN CHAT HAS AN INFO SCREEN. Tap its name at the top. It used to do nothing at all, on the one chat people are most likely to be suspicious of. It now says who it is, that nobody can message in, and that we will never ask you for your password, your login code, or money. That last line is the useful part. Fake support asking for your login code is the likeliest thing anyone will ever try on this app.

            BLOCKING THE FARIIN CHAT NOW KEEPS SECURITY ALERTS. Everything else stops. That is on the block screen in writing, and I found the code did not actually do it after I had written the promise, so the code changed rather than the sentence.

            THE CANCEL BUTTON IS BACK. You photographed this: a red button floating with no way out. On this version of iOS one kind of confirmation box quietly drops its Cancel. It was on Block, and it was also on Clear Chat History, which deletes every message you have. The most destructive button in the app was the one you could not back out of.

            TWO SECURITY HOLES CLOSED ON THE SERVER, already live, nothing to update. A banned account could unban itself. And anybody could take any username, including one already in use. Both were the same mistake by me: I thought the rules chained one after another, and they do not, they add up.

            YOUR SECURITY EMAILS WERE GOING TO THE WRONG PLACE. You caught this one. Adding an email to your account sent the warning to the address that had just been added, instead of the one you have always used. It turns out the address on an account MOVES when you add a new one, so four different warnings were following whoever attached themselves most recently. Sign-in alerts, method added or removed, and both account deletion emails now go to every address on the account. The "a login was added" one deliberately skips the new address, since telling them hands over your name and your list of logins.

            ADDING AN EMAIL NOW ASKS YOU TO PROVE IT. Your words: it just took the email and password and let you through without checking you own the address. Right, and it was that way for password resets too. Both now send a confirm link first. Already live on the server.

            WHAT TO CHECK. The ordinary things, since a lot moved: send a photo, send a video, forward an album, open old chats, make a call. Then tap the Fariin chat's name, and try Block and Clear Chat History and check both offer you a Cancel.

        run: fastlane beta
