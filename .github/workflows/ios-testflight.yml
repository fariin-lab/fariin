name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            SEVEN STORY FIXES. The background behind a story is the big one, and it is a replacement rather than another patch.

            THE BLUR IS GONE. TELEGRAM DOES NOT BLUR, AND NOW WE DO NOT EITHER. You asked me to read their code first, so I did. There is no blur anywhere in their story pipeline. They take two colours off the picture itself, the colour at the top and the colour at the bottom, draw a gradient between them, and BAKE IT INTO THE FILE when you post. Their viewer draws no background at all, which is exactly why theirs never breaks while you scroll.

            Ours was a live blur that redrew itself every frame, and it came apart whenever anything moved the card. That is what you were seeing. Six separate patches had been written for six symptoms of that one cause, and all six are now deleted along with it. Your videos already worked this way since you chose the gradient. Photos have joined them, so a picture and a video now behave the same.

            A photo that does not fill the frame is also posted as a FULL frame now, gradient included, so nobody watching has to invent a background for it. Stories you posted before this build still get the gradient drawn live, and it is the same gradient from the same two colours, so you should not be able to tell them apart.

            THE STORY GOES DARK WHEN YOU OPEN THE REPLY KEYBOARD. Your screenshot next to Telegram was right. Their number is black at 80 per cent, and it turns on only when the keyboard has height. That is what this is. It does NOT shrink the picture, because theirs does not either. I checked: with the keyboard up their card actually gets slightly taller.

            STORIES OPEN FASTER. Your own story was never slow. A friend's story was, and it was a retry loop waiting 50 milliseconds between looks while the open sat there holding a black screen. It looks every frame now, and it tries once immediately instead of always waiting a turn first.

            THE BLACK CORNERS AT THE START OF A PULL DOWN. Only on the first pull, which was the clue. The story is told to stop clipping its own corners and the mask takes over, but the telling goes through SwiftUI and lands a frame or more later. In that gap two different curves were cutting the same corner. The card now says when it has actually let go, and the mask waits for it. The fix you asked me to protect is untouched and still does exactly what it did.

            A STORY OPENED FROM A REPLY GOES BACK WHERE IT CAME FROM. It was flying home to a remembered rectangle, and the chat reuses its rows, so the thing that rectangle described was sometimes no longer there. It asks the real view now. If the reply has genuinely scrolled away it drifts off instead of landing somewhere wrong.

            A VIDEO COMES BACK ON THE FRAME YOU LEFT IT ON. Watch to ten seconds, swipe away, swipe back. The position was already resuming, but the picture on top of it was the cover made when you posted, which is second zero. It keeps the real frame now.

            THE VIEWERS SHEET SWIPES WITHOUT LAGGING. Dragging it sideways was rebuilding the entire story screen on every frame, pager and sheet included, to move one row of cards. Only the row is rebuilt now.

            WHAT TO CHECK FIRST: post a square photo and a square video, then watch them and scroll the row hard. Then open a story, tap reply, and look at how dark it goes.

            STILL OPEN: edited videos still export with black bars instead of the gradient.
        run: fastlane beta
