name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            PLEASE TRY THESE FIRST, they are the risky ones. Send a photo in a normal chat, send a photo with a caption, send a photo as a reply, and send a video. Then do all four again in a group. Then forward a photo, forward a video, and forward an album that has several photos AND a video in it, and check the album arrives in the same order you sent it. Sending and forwarding were made faster by doing several things at once instead of one after another, and only a real phone can tell us it still works.

            SENDING AND FORWARDING ARE FASTER. Nothing was waiting on anything it needed. A photo was waiting for its own caption and its blurred preview to be sealed after the upload finished, when neither depends on it. A video was uploading the clip, waiting, then uploading its small poster. And forwarding an album fetched every picture one at a time, so a ten photo album made ten trips before anything went out. All of that now happens together.

            POSTING A STORY IS FASTER too, for the same reason. The photo now starts uploading straight away instead of waiting for two round trips first.

            THE STORY RING ON A PROFILE IS THERE THE MOMENT THE PAGE OPENS. Before, you watched the app work out whether the person had a story and how many, and then draw it. Now it knows before the page appears.

            DARK MODE ON THE LOG IN SCREEN. The Sign in with Apple button was black on a black page, so it looked like a missing button with floating text. Apple's button takes its colour when it is created and cannot be repainted, so it is rebuilt when you change your phone between light and dark.

            ERROR MESSAGES ARE IN ENGLISH. Typing the wrong password on Delete Account answered "The supplied auth credential is malformed or has expired". A translation for that existed but only the Log In screen could reach it. Every door shares it now.

            CANCELLING IS SILENT. Backing out of the Google sheet used to put a wall of red Apple text on screen, on the page about deleting your account. Cancelling is a decision, not a failure, so it now says nothing.

            THE SYSTEM SAYS FARIIN. The Google sign in prompt said "Kulan" wants to use accounts.google.com. That is a different name setting from the one on your home screen and it was never changed.

            SHARING GIVES A REAL LINK. Your username, a contact and a group invite now share as fariin.com links. Before they were kulan:// links, which only work on a phone that already has the app, so anyone without it got dead text. Now it opens the app if they have it and a real page if they do not. Your QR code carries the same link.

            THE WELCOME SCREEN SHOWS THE RIGHT LOGO. It was still using the old arrow mark you removed from the icons a week ago. It is the speech bubble now. The Log In button under it is outlined instead of filled grey.

            FORGOT PASSWORD IS ITS OWN PAGE. It used to fire the moment you tapped it, with no chance to check your address, and told you off if the field was empty. Now it shows you the address before sending, and afterwards leaves it on screen so you know which inbox to open.

            THE SIGN UP FORM. The big empty gap between the button and the keyboard is gone, there is an eye to check the password you typed, "at least 6 characters" stays on screen and ticks itself off as you type, and the greyed out button no longer looks broken.

            YOUR USERNAME IS CHECKED WHILE YOU TYPE. The green tick used to only mean the letters were allowed, so it showed a tick on a name somebody else already had and only told you after you tapped Continue. It now says available or taken as you type.

            TAP THE SCREEN TO CLOSE THE KEYBOARD on any of the sign in pages. There was no way to put it away before.

            THE PAGE THAT ASKS YOU TO COME BACK, after you delete your account, was written as a warning. It led with "your account is scheduled for deletion" under an orange clock and gave Delete It Now a button the same size as Restore. It now leads with the fact that matters, that nothing is gone, and the delete option is a quiet line of text.

            EMAILS, and these are already live so you do not need this build to see them. The deletion email said "this cannot be undone" when it is not true, you have 30 days and signing back in brings everything back. It now names the real date and tells you how to come back. You get an email every time anyone signs in, not only from a new phone. Creating an account finally sends you something. And when the 30 days run out you get one last email. They all look like one company now.

        run: fastlane beta
