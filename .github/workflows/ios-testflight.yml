name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            ADD STORY OPENS THE CAMERA now, full screen, built to the picture you sent. The close button and the flash sit on the preview, the zoom and the shutter at its foot, and underneath there is the pictures button on the left, the CAMERA and TEXT tabs in the middle and flip on the right. The old picker page is not gone, it is what the pictures button opens, because that is the only way to post a VIDEO story.

            PLEASE TRY FIRST: take a photo and post it, then open the pictures button and post a video, then TEXT. One thing is missing on purpose. Your picture has a second button beside the flash. In Signal that takes a burst of photos and sends them together. We have nothing like it and I do not ship a button that does nothing, so tell me what you want there.

            THE PINNED BAR SHOWS THE MESSAGE, not Tap to view. It was looking for the pinned message among the ones loaded on screen, and a pin is almost always older than that, so it had nothing to show. It now fetches the pinned messages themselves. It also stops saying a message was deleted when it was only too old to reach: that word now appears only when the message really is gone. Tapping a pin that is too far back to jump to opens the pinned list instead.

            MENU ICONS ARE THE SAME SIZE AS EACH OTHER, measured properly this time. Mute, Pin and Delete looked small next to Unread and Archive. Every earlier attempt set the box around the icon, and the box is not what you see: Apple draws its icons with air around them, and your pin is a thin shape on a square canvas. The size is now applied to the drawing itself, with the empty space trimmed off first.

            ALL MEDIA USES APPLE'S OWN TAB BAR, the same control as All and Missed on the Calls page. The white highlight is the real one now, not our copy of it.

            THE SWIPE BETWEEN MEDIA, FILES AND VOICE IS SMOOTH. There was a second animation running on top of your finger, over all five tabs at once, on the exact frame the swipe needed. It is gone.

            EDIT PHOTO IS THE PHOTO. Tapping it now shows your picture large with an X on it to remove it, and Take photo and Choose photo underneath. Take photo opens the camera and lands in the same cropper a chosen photo does.

            ZOOMING A CHAT PHOTO: the controls hide when you zoom, and a tap brings them back and hides them again, at any zoom. Before, a tap did nothing once you had zoomed.

            THE PIN BAR BUTTON is the same size as the rest of the icons.

            From 449:

            NO PICTURE MEANS THE CIRCLE, everywhere. You showed me an account with no picture that still opened with the big header. Yesterday's fix moved the decision onto your account record, and a record can name a photo that is not there any more, so the app believed in a picture it could not draw. It now asks one more question before it draws anything: is there really a picture behind this. Nothing to load means the circle. This is checked on a person's profile opened from a chat, from the Calls list and from a story, on a group, and on your own preview in Edit Profile.

            PLEASE TRY FIRST: an account with no picture, and one with a picture, opened all three ways. The right layout on the very first frame, and it must not change while you are looking at it.

            MENU AND SWIPE ICONS are the same size as the rest now. You said the last ones came out too small. They did, because I sized them to the text instead of to the picture box that a normal icon fills, and this time the number is one number for menus and for swipe buttons together.

            EDIT PROFILE, the Large tab is now called Preview and it is a card deck. Your card in front, the same card peeking out either side and tilted, your name and username on the card itself.

            ALL MEDIA no longer flashes when you swipe fast. Swiping quickly through photos there could land you on an empty page for a moment. A chat never did this because a chat opens one photo with nothing to swipe to. Photos further ahead are now drawn instead of left blank, and the neighbours start loading the moment you move.

            THE CHAT LIST no longer keeps a row lit under the chat you opened. It only lights while your finger is on it, which is what you asked for. The grey that stayed on all through the back swipe is gone.

            From 448:

            PROFILE PICTURES, the big one. Some people who have a photo were opening with the small circle, and some people with no photo were opening with the big header and then switching back a second later. Both are fixed, and one half of it was in the data: removing your picture only cleared half of it and left the tall crop behind, so every other phone still had a record saying you had a photo. The app no longer guesses at all. It asks your account record, has the answer before it draws anything, and keeps that answer for the whole visit.

            PLEASE TRY FIRST: open the profile of somebody WITH a photo and somebody WITHOUT one, and reach each of them three ways - from the chat, from the Calls list, and from their story. Every time it must be right on the very first frame and must never change while you are looking at it. Then remove your own photo and check what your friend's phone shows you as.

            Icons in menus are the right size: Unread, Archive, Add Story, and the pin and the archive on the swipe. This fix was finished before build 447 and missed it, because that build was made from the wrong commit.

            A pinned FILE or PDF now shows its preview and its name in the pin bar at the top of the chat, instead of an empty line.

            The All Media tab bar uses the same moving pill as the All / Missed bar on the Calls page.

            Zooming a photo in a chat hides the buttons. Pinch in and the top bar and the bottom buttons fade away, let it back to normal size and they come back. They also come back when you swipe to the next photo.

            Your own picture in Settings opens SQUARE instead of in a circle, the bottom tab bar gets out of the way, and the top says Profile photo.

            Edit Profile, the Large tab, is a clean preview: your picture at the shape the big header crops it to, your name, your username, and nothing else.

            From 447:

            THE DELETE SYSTEM, all layers fixed. Deleting a photo, gif, voice note or file for everyone flips it to the placeholder instantly, on both phones. The placeholder is a quiet capsule, and a deleted message is completely dead - no reactions, no reaction bar, no double-tap, no swipe to reply. A deleted STORY flips your reply card to Story unavailable. An emoji-only story reply shows as the big emoji. The X on a full-screen profile photo works.

        run: fastlane beta
