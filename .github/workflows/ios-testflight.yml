name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            HOTFIX for build 421/422. One mistake of mine caused three of the things you just reported.

            Reacting has to lock the emoji with your contact's key before saving it. A change I made last night cleared that key from memory every time any old message failed to unlock, which happens constantly while you scroll. With the key gone, reacting saved nothing at all, so double-tap and the long-press reaction bar both looked dead. The same wipe made photos fail to unlock for a moment, which is the flashing you saw when swiping pictures, and it stopped pin notices from sending.

            Fixed: the key is never cleared now. It refreshes by fetching and replacing, once per contact per app launch, so a contact who changes phone still repairs itself and nothing else is disturbed.

            Also: pinning when you already have 3 pinned messages used to do nothing silently. It now tells you to unpin one first. Your test chat is at 3, which is why Pin looked broken.

            Please check: react by double-tap and from the long-press bar, swipe through photos and watch for flashing, and unpin one message then pin another.

            NEW IN THIS BUILD
            Deleting one photo out of an album now really deletes it, everywhere it appears, instead of the photo coming back. When a message is deleted, its photo, video, voice note or file is now deleted from the server too, rather than living there forever. Signing out can no longer be undone by data that was still loading, which could briefly show the previous account's calls and stories to the next person on the phone. Tapping a story reply opens the story you actually replied to. The busy tone plays fully instead of cutting off. A dead group call's Join bar is cleared by whoever opens the empty room, instead of sitting there for hours. Answering exactly as the caller cancels no longer leaves you stuck on Reconnecting. Deleting several selected calls no longer silently skips some of them. Cancelling a story upload now cancels all of it, so the post you cancelled cannot go up anyway.

            EVERYTHING BELOW IS ALSO HERE, from the previous build, in case you skipped it.

            FIXES THAT PROTECT YOUR DATA
            A message you deleted before it sent can no longer send itself later. Deleting a call now only deletes it from your phone, not from the other person's. Videos sent inside an album no longer disappear from your own phone after the other person watches them. Deleting a message for everyone now also clears it from both chat lists, where the text used to stay readable. If a contact gets a new phone, your chat with them repairs itself instead of showing locks forever.

            PRIVACY
            Blocking someone now reaches everywhere: they cannot be called from the Calls tab by accident, they stop seeing stories you already posted, their missed calls stop appearing, and they can no longer tell they were blocked from how your phone answers. Signing out clears your settings so the next person on the phone does not inherit them, including one that was silently declining their calls. Strangers can no longer see photos, bios, last-seen or call buttons you limited to friends. View-once photos stop leaving a thumbnail in the chat list.

            THINGS THAT SIMPLY DID NOT WORK
            Show Notifications stays off when you turn it off. In-App Sounds, Vibrate and Preview now do something. Opening a chat from search no longer wipes the other person's unread badge. "typing" no longer sticks forever after you send. Old pinned messages are reachable again. AirPods now work on calls you place. The app no longer keeps every chat you open in memory.

            LOOK AND FEEL
            The long-press menu now uses Signal's exact measurements. Links inside your blue bubbles are white and readable. A reaction is no longer sliced when you long-press. Settings and profile pages use Signal's spacing. Profiles show your private note as a Notes card, two lines with More. Tapping an avatar with no picture does nothing instead of opening an empty circle.

            PLEASE TRY: place a call with AirPods in; block a test contact and check calls, stories and search; turn Show Notifications off, force-quit, reopen; send a message then immediately delete it before it sends; forward an album; and long-press a message you reacted to.
        run: fastlane beta
