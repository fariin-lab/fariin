name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          TF_CHANGELOG: |
            THE DELETE SYSTEM, all layers fixed. Deleting a photo, gif, voice note or file for everyone flips it to the placeholder instantly, on both phones, even if they are offline. No more nothing-happens, no more the-previous-one-deletes-instead, no more a-voice-note-coming-back. Part of this fix is on the server, so it applies the moment you update.

            The placeholder is a quiet capsule now, not a loud bubble in your chat colour. Same fixed look in every chat, readable over any wallpaper.

            A deleted message is completely dead: reactions vanish the instant you delete, no reaction bar on long-press, no double-tap, no swipe to reply. Long-press gives Delete (your side only, since it is already gone for everyone) and Select.

            A deleted STORY flips your reply card to Story unavailable, instead of showing a preview of nothing.

            An emoji-only story reply shows as the big emoji under the story card, not squeezed in a grey box.

            The X on a full-screen profile photo works now. The invisible top bar was stealing the tap, so the X is a real bar button now, on people and groups both.

            The photo cropper's window morphs from the circle to the tall frame between the two steps instead of cutting.

            PLEASE TRY FIRST, with two phones: delete a photo with no caption for everyone, then a voice note, then a gif. Each must flip to the placeholder instantly on your phone and within a second or two on the other one, and deleting one message must never touch another. Then long-press a placeholder: only Delete and Select. Then tap a profile photo and press the X.

            From 446:

            The white lines down the left and right of a profile photo are gone. The pill on the All Media bar sits in the middle of its slot again, and the bar is 42pt. Edit Profile has Circle and Large tabs, so you can see both crops of the same photo before you save.

            From 444:

            Setting a photo has TWO steps: first you frame the CIRCLE that shows in chats and groups, then the TALL header with the Blur band marked. Save writes both. Nothing changes until you press Save.

            The profile photo has no line at the bottom. It fades into the page's own colour, so the bottom of the photo IS the background.

        run: fastlane beta
