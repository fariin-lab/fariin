name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            BLURRED PHOTOS, MENU ABOVE THE KEYBOARD, ONE-TIME MEDIA, SWIPE MUTE, DEVICE LOCATION.

            CHAT: a received photo no longer stays blurred after it has loaded. The long-press menu opens above the keyboard. One-time photos and voice notes are spent the moment they open and cannot be opened again. A photo with a caption and a reaction shows its time beside the reaction. The voice note bar hides when the note finishes.

            CHAT LIST: swipe Mute is one tap (mute, or unmute). The timed choices are still in the long-press menu.

            PROFILE: Share Profile sends the profile card. Send Message on a profile card opens that chat on top, and Back returns to where you were.

            STORIES: posted stories open right after sign-in. The Posted stories card spacing is tidied.

            ATTACH SHEET: the album list and the album slide together.

            DEVICES: each device shows its city and country.

            PLEASE TEST: open a chat with new photos; long-press a message with the keyboard up; open a one-time photo and a one-time voice note twice; swipe Mute in the chat list; Share Profile to a friend; Settings > Devices.

            EARLIER IN THIS ROUND (build 810): FARIIN LIGHT/DARK, HEADER TEXT, CAPTION REACTIONS, ALBUM CANCEL, KEYBOARD ON TAP.

            FARIIN CHAT: never uses a wallpaper, and its posts change with light/dark at once.

            CHAT: the name and "online" in the header change colour right away with light/dark or a new wallpaper. Tapping a message keeps the keyboard open. A photo with a caption: double-tap the caption to react, and reactions sit inside under the caption. A cancelled photo in a group leaves at once, even the last one.

            ATTACH SHEET: Back from the album list is instant.

            DEVICES: bigger icons, and the device sheet is solid light/dark.

            CHAT LIST: the disappearing badge is a little smaller and looks like a notch in the photo.

            PLEASE TEST: switch light/dark in Fariin and in a chat with a wallpaper; tap messages with the keyboard up; react on a caption; send 2 photos and cancel one.

            EARLIER IN THIS ROUND (build 809): WALLPAPER: SWIPE YOUR PHOTOS, CANCEL DOES NOT SAVE, NEW RESET MENUS.

            WALLPAPER: tapping a photo you already use opens it without pinch or drag, and you can swipe through all your wallpapers. A photo you pick and close without Apply is not kept. Each page's ... menu shows its own two resets.

            PLEASE TEST: Settings > Wallpaper, tap your photo and swipe; pick a photo and tap X; open the ... menu on Wallpaper and on Chat Color.

            EARLIER IN THIS ROUND (build 808): ONE-TIME MEDIA, MENU ABOVE THE KEYBOARD, APPLE PASSWORD, ALBUM CANCEL, CLOCK.

            ONE-TIME: a photo opens once only; a voice plays once and the page closes, and it is downloaded before you open it; with a reaction the bubble keeps your normal shape.

            CHAT: keyboard open, long-press the last message: the menu stays above the keys. The sending clock lines up with the time. A photo you cancel in a group leaves at once.

            PASSWORD: an Apple account with a hidden email can set a new password by signing in with Apple. Forgot password is a link.

            LOG OUT: a playing voice note stops.

            PLEASE TEST: open a one-time photo twice; play a one-time voice to the end; keyboard up, long-press the last message; send 3 photos and cancel one.

            EARLIER IN THIS ROUND (build 807): VOICE BAR MAKES ROOM IN CHATS, DEVICES SHEET, ALBUM FROM RECENTS WITHOUT SLIDE.

            CHATS: the playing voice note bar now pushes the list down instead of covering "Pinned".

            DEVICES: smaller rows, round blue icons, and a device opens as a sheet with a red Sign Out button.

            ATTACH SHEET: Album from Recents opens with no slide; folders and Back still slide.

            CHAT LIST: the disappearing badge is a little smaller with a grey clock.

            WALLPAPER PREVIEW: the close button, the dark/light button and swiping between wallpapers work again.

            PLEASE TEST: play a voice note and leave the chat; open Settings > Devices and tap a device; open Album from Recents, then a folder, then Back.

            EARLIER IN THIS ROUND (build 806): KEYBOARD STAYS UP WHEN YOU LONG-PRESS A MESSAGE, NEW DISAPPEARING BADGE.

            CHAT: with the keyboard open, long-pressing a message (latest or older) no longer closes the keyboard, and closing the menu no longer makes the messages jump.

            CHAT LIST: the disappearing badge hangs past the photo edge; dark mode is a dark grey disc in a black ring.

            PLEASE TEST: keyboard open, long-press the latest message, react, close; repeat on an older message; look at the badge in light and dark.

            EARLIER IN THIS ROUND (build 805): VOICE BAR NO LONGER COVERS PINNED, ATTACH SHEET BOTTOM, DISAPPEARING BADGE.

            CHATS: the playing voice note bar no longer covers "Pinned", even when it appears as you leave a chat.

            ATTACH SHEET: no white band at the bottom; the bar and Album button keep the same gap from the sheet half or full; Album from Recents opens without a slide (folders and Back still slide).

            CHAT LIST: disappearing badge is white with a black icon in light mode and black with a white icon in dark mode, icon a little bigger.

            PLEASE TEST: play a voice note, leave the chat, look at the top of Chats; open the attach sheet half and full; look at a chat with disappearing messages on.

            EARLIER IN THIS ROUND (build 804): GLOW SHEET PICTURE.

            GLOW: the "What a Glow does" sheet shows the new illustration (light mode; dark mode keeps the Glow icon for now).

            PLEASE TEST: tap Glow on someone's profile in light and dark mode.

            EARLIER IN THIS ROUND (build 803): ATTACH SHEET FIXES, VOICE BAR REDESIGN, DISAPPEARING BADGE, TWO-STEP AND FORGOT PASSWORD.

            ATTACH SHEET: the bar and Album button no longer vanish on Album or Back, no flicker when you open an album, albums slide in from the right, a fast swipe keeps the bar in place with no empty band, and the bottom corners follow the screen like Apple's sheets.

            VOICE BAR: new minimal look (play, name, speed); it no longer covers "Pinned".

            CHAT LIST: a timer badge on the photo when disappearing messages are on.

            TWO-STEP: Turn Off shows a spinner, and asks you to sign in again when needed instead of doing nothing.

            FORGOT PASSWORD: after the code you can create a new password.

            PLEASE TEST: open Album, go back, open Videos; flick the full attach sheet down fast; play a voice note and leave the chat; turn two-step off; use Forgot password.

            EARLIER IN THIS ROUND (build 802): PROFILE PHOTO NO LONGER STUCK BLURRED OR MISSING, CHAT BUTTONS IN DARK MODE, ATTACH SHEET, BLOCK NOTICES.

            PROFILE: someone's big photo no longer stays blurred. If it cannot load, their round photo shows sharp instead, and the page keeps trying. A page that opened with the grey silhouette tries the photo again before giving up.

            CHAT: after switching light/dark with a chat open, Back and the call buttons change at once, no reopen.

            ALSO: attach sheet keeps its place on a fast swipe; Fariin reaction pops like a chat; block notices stay after reopening a chat; Fariin search highlights the words.

            PLEASE TEST: open a friend's profile several times; switch light/dark inside a chat.

            EARLIER IN THIS ROUND (build 800): PROFILE PHOTOS VISIBLE TO OTHERS AGAIN.

            PROFILE PHOTO: a photo set to Everyone (nobody hidden, nobody blocked) is visible to everyone again. Open this build once so your photo is updated; people on "My Chats", Hide From or with blocked people still follow those settings.

            PLEASE TEST: open this build, then have a friend open your profile and your chat.

            EARLIER IN THIS ROUND (build 799): SEND LOCATION BUTTON, LOCATION BUBBLE, FARIIN REACTION FACE, FORWARD ROWS, ATTACH SHEET WHITE TILES.

            LOCATION: the whole Send Location button works, not only its words. The location bubble has the place and the time on one row, no empty band.

            FARIIN CHAT: your reaction shows your photo beside the emoji, like a normal chat.

            FORWARD: the chat rows on the Send to page are shorter.

            ATTACH SHEET: pulling the full sheet down no longer turns photo tiles white while they reload.

            PLEASE TEST: send a location by tapping the edge of the button; look at a location bubble; react to a Fariin post; open Forward; open the attach sheet full and pull it down slowly.

            EARLIER IN THIS ROUND (build 798): SEARCH BAR ON BACK, HEADER IN LIGHT/DARK, LAST SEEN COLOUR, FARIIN POSTS, NO EDIT ON FORWARDS.

            CHATS: the search field stays grey during the Back swipe from a chat. The header buttons and search field switch with light/dark at the same moment as the rest of the screen.

            CHAT HEADER: "last seen" takes the right colour straight after switching light/dark.

            FARIIN CHAT: no "Fariin" name inside posts, and no empty strip at the bottom of a post.

            FORWARD: Edit is no longer offered on a forwarded message.

            PLEASE TEST: open a chat and swipe back slowly; switch light/dark with the chat list and a chat open; look at a Fariin post with and without a reaction; long-press a forwarded message.

            EARLIER IN THIS ROUND (build 797): FARIIN SPACING, REACTIONS, MUTE MENU, WALLPAPER LIGHT/DARK, WALLPAPER CHATS IN LIGHT MODE.

            FARIIN CHAT: the empty space over the "Only Fariin can send messages" bar is gone. Your reaction appears the moment you tap. Profile > Mute offers 1 hour, 8 hours, 1 day, 1 week and Always, and a timed mute ends by itself.

            WALLPAPER PREVIEW: the slider is replaced by one button, top right: tap for dark, tap again for light. Your bubble shows the real chat colour.

            CHATS WITH A WALLPAPER follow the phone's light or dark mode again.

            PLEASE TEST: open Fariin and look at the bottom; react to a post; Profile > Mute > 1 hour; the wallpaper preview button; a chat with a wallpaper in light mode.

            EARLIER IN THIS ROUND (build 796): FARIIN CHAT AS A CHANNEL, TIMER ICON ORDER, NEW FORWARD SHEET, ONE-TIME VOICE PAGE.

            FARIIN CHAT: posts are wide channel cards with "Fariin" and the tick on top, pictures edge to edge, buttons as full rows, and a round forward button beside each post. The last post sits where a message sits above the typing bar. Tap your reaction to see "Tap to remove". About reads "The only official chat from Fariin".

            DISAPPEARING MESSAGES: the icon sits between the time and the tick, on every message sent while the timer is on, from the moment you send.

            FORWARD: "Send to" with Frequently contacted and Recent chats; the Forwarding preview is gone.

            ONE-TIME VOICE: opens straight to your voice bubble with its waveform, no loading.

            FORWARD: a message forwarded back into the chat it came from is a normal message, no "Forwarded" label; forwarded to anyone else it says Forwarded (text, photos, videos, voice, files, GIFs, albums).

            REACTIONS: tap a reaction, then your own row, to remove it (older messages too).

            ALL MEDIA: back and ••• follow light mode.

            PLEASE TEST: open Fariin chat and scroll to the bottom; send in a disappearing chat; wallpaper preview slider then Apply; forward a message; open a one-time voice note; forward a message back to the same person and to someone else; remove an old reaction; All Media in light mode.

            EARLIER IN THIS ROUND (build 795): LONG PRESS ON THE FARIIN BUTTON MESSAGE, PHOTOS NO LONGER OPEN AFTER A LONG PRESS.

            FARIIN CHAT: long press and double-tap to react should work on the "Review Devices" message, the same as on the plain message.

            PHOTOS: long-pressing a photo and letting go no longer opens it.

            PLEASE TEST: long-press and double-tap the Review Devices message; long-press a photo and let go.

        run: fastlane beta

      # ⛔ KEEP THE SYMBOLS — 2026-09-29: build 797 crashed on the owner's phone and the report
      # could not be read. The archive makes a dSYM, the export is told not to send it to Apple
      # (`uploadSymbols: false`, see the Fastfile for why), and the runner threw it away, so nothing
      # anywhere could turn the crash's addresses back into function names. Kept here per build.
      - name: Keep the dSYM for crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dSYM-${{ github.sha }}
          path: "**/*.dSYM.zip"
          if-no-files-found: warn
          retention-days: 90
