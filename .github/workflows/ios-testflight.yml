name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            EVERYTHING FROM TODAY'S SCREENSHOTS IS IN THIS BUILD. The corners, the colour bleed around them, the iOS 26 blink, the close after swiping, and last night's row problems.

            THE CORNERS STAY ROUND THE WHOLE WAY DOWN. The story card was cutting its own corners with a curve that shrinks as the card shrinks, so by the time it was small the corners were nearly square. One curve owns the corners now, from the first moment of the pull to the landing, caption included.

            THE COLOUR BLEED AROUND THE CORNERS IS HIDDEN BEHIND THE PICTURE, your suggestion, done exactly that way. The small card picture the story turns into has its rounded corners baked in at the small size, so while it is drawn large mid flight there was a gap at each corner where the story leaked out. The picture now carries a second copy of itself behind it, slightly zoomed, so anything that leaks shows the picture instead of the story. This fixes the open and the close, both.

            THE FULL SIZE BLINK AT THE END IS GONE, your iOS 26 report. The app was putting the screen back to full size and trusting Apple to remove it in the same instant. iOS 26 keeps it for one extra frame, and that frame was the giant story you photographed. The screen now goes blank first, so there is nothing left to see on either iOS.

            THE CLOSE AFTER SWIPING IS THE SAME CLOSE. Open a story, swipe to the next person, scroll down: it used to fade out instead of flying home. Now the new person's slot empties and their picture rides the card down, exactly like the first story.

            FROM LAST NIGHT, ALSO IN THIS BUILD: stories no longer open as stretched ovals the first time the app starts. Long pressing a card keeps the card's own rounded corners. The lifted card shows the person's name again.

            WHAT TO CHECK FIRST: open a story and scroll down slowly, watching the corners. Then swipe to the second person and close. Then close on iOS 26 and watch for the blink.

            STILL OPEN, do not report again yet: the story pausing by itself after you come back into the app (I asked you two questions about it), and edited videos exporting with black bars instead of the gradient.

        run: fastlane beta
