name: TestFlight

# Manual trigger so we only ship to TestFlight when we mean to.
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode (Apple requires the iOS 26 SDK for upload)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "key bytes: $(wc -c < "$RUNNER_TEMP/AuthKey.p8")"

      - name: Import distribution certificate
        env:
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          echo "$DIST_P12_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/dist.p12"
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "Identities:"; security find-identity -v -p codesigning "$KC"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      - name: Build & upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          # KEEP THIS IN STEP WITH THE BUILD. It is hardcoded here, so it does NOT change when the code
          # does — build 458 went out carrying build 456's notes, which told testers to go and check a
          # story crash that had already shipped two builds earlier. Rewrite this block before every
          # ship, in the same breath as deciding to ship.
          TF_CHANGELOG: |
            THIS BUILD: GIF BOTTOM BAR IS LIQUID GLASS.
            GIF page: the mood bar along the bottom is now Liquid Glass, edge to edge; GIFs blur as they pass under it.
            GIF page: space at the left and right of the GIFs; no line under the header, the GIFs fade under it with the iOS blur. Message field: your own camera icon.

            EARLIER: APP UPDATES FROM THE ADMIN PANEL.
            The app now asks the server whether this version must update, may update, or is fine (nothing shows until a campaign is made in the panel).
            Stories: a repost cannot be one-time and cannot block screenshots. Chats: more space between location cards.
            Files: tapping a file opens it once, even with several taps while it loads (no more 3 pages and 3 closes). The X on Files just closes. GIF search: the row becomes the search field with an X on its right. GIF mood bar: no border, no GIPHY text, sits on the bottom edge.
            Location: Send Location always names the place (tries again if the lookup fails; shows Finding place while it looks).
            Attach: with the keyboard up, + opens the sheet while the keyboard is still going down (one motion, like the reference app), not after it.
            PLEASE TEST: in the panel's App updates, make a Mandatory campaign for your own @username with a minimum build above this one, activate it, open the app; then pause it.

            EARLIER: NO MORE POP WHEN A PHOTO OPENS FROM THE ATTACH SHEET.
            Attach sheet: the zoom no longer skips its first frames while the editor is being built, and a photo opened right after closing one no longer flashes away. The hidden measurement stays in to confirm it.
            Location, GIF, Files: the attach sheet closes and the page opens as before; X closes; GIF bars fixed; Files ••• chooses Grid or List.

            EARLIER: MEASURING THE ATTACH PHOTO OPEN.
            Attach sheet: each photo you open from the grid now writes a hidden measurement (nothing on screen, nothing else changes) so the centre-column pop can be found exactly.
            Attach sheet: Location, GIF and Files close the sheet and open their page again (the old motion), with the new designs. Back returns to the photos.
            PLEASE TEST: open the attach sheet, open a LEFT photo, close it, then open the CENTRE photo next to it. Do it 2 or 3 times. Keep the app open for 10 seconds after, then say done.

            EARLIER: LOCATION, GIF AND FILES OPEN INSIDE THE ATTACH SHEET.
            Attach sheet: Location, GIF and Files open inside the sheet. Back (top left) or a swipe from the left edge returns to the photos.
            Attach sheet: new Location page (Places In This Area, blue pin, Send Location with the place name) and Add files page (Upload files, Recent files).
            Chats: the camera moved from the attach sheet into the message field, beside GIF.
            Calls: the screen share button is faded until it can be used, and white while you are sharing.
            Voice: round ends on the recording bar, a smaller X, an easier play button, and Liquid Glass rings around the mic.
            Video editor: the same sizes as the photo editor. Message Requests: Kulan's own sheet and icon. Fariin row shows the message.
            PLEASE TEST: open Location, GIF and Files from the attach sheet and swipe back; take a photo from the field's camera; share your screen.

            EARLIER: LOCKED MESSAGES AFTER SWITCHING ACCOUNTS.
            Chats: a message sealed with someone's earlier key now opens instead of showing a lock (for example after one of your accounts signed in on another phone).
            Attach sheet: the bar stays on the bottom of the sheet while it grows to full or shrinks back.
            Attach sheet: the photo editor has the reference sizes (photo between the bars, caption bar on the bottom edge). Videos and picked photos open with the same motion as a received photo.
            Search: finding people no longer hangs on the loading rows.
            Message Requests: an icon and explanation when empty, and a one-time card explaining requests.
            PLEASE TEST: switch accounts and open a chat you sent from; drag the attach sheet to full and back; search a username.

            EARLIER: NEW VOICE RECORDING BAR.
            Voice: the recording bar is 44pt. Locked: X, a live waveform, the one-time 1 and send, all inside the bar. Paused: X, play, waveform, time, 1 and send.
            Voice: the circles around the big mic are soft moving shapes now that react to your voice.
            Security Checkup: slides up once at its size, no small sheet first and no jump to full height.
            Chats: pasting long text scrolls the box to where you are typing. Link previews darken when you touch them.
            Attach sheet: a photo opens with the same motion as a photo someone sent you, no pop at the end.
            PLEASE TEST: record a voice note, lock it, pause it; open Security Checkup twice; paste a long link.

            EARLIER: ROUNDED CORNER WHEN A PHOTO CLOSES.
            Attach sheet: closing a photo back into a top-left or top-right tile, it now keeps the sheet's rounded corner instead of a square one.
            PLEASE TEST: open the top-right photo in the attach sheet and swipe it down.

            EARLIER: SHARE SCREEN BUTTON ON THE CALL SCREEN.
            Calls: the top-right dots button is now one Share Screen button. Tap to share, tap again to stop.
            Security Checkup: back to Apple's own sheet, sized to what it shows. It still opens with the answers ready.
            Attach sheet: a photo zooms in and stops at its size, no zoom-out after.
            Attach sheet: the bar at the bottom keeps the same gap to the screen's sides, half or full.
            PLEASE TEST: share your screen from the new button; open a photo from the attach sheet; drag the attach sheet to full.

            EARLIER: SEARCH ARROWS OFF THE EDGE.
            In-chat search: the up and down arrows now sit the same distance from the right edge as the jump-down arrow.
            PLEASE TEST: search inside a chat and look at the arrows on the right.

            EARLIER: SECURITY CHECKUP SLIDES UP FROM THE BOTTOM.
            Security Checkup: a real bottom sheet now, on the bottom edge and only as tall as what it shows. Drag it down or tap above it to close.
            Security Checkup: checks again by itself after you change a passkey, password, Chat Key or device, so it opens with the answers ready, no spinner. The top line says when it last checked.
            Call card: pulling the tab out of the RIGHT edge now follows your finger exactly, like the left.
            Attach sheet: the first tall photo you open after restarting the app lands at its right size, no jump a second later.
            PLEASE TEST: open Security Checkup from Devices; add or remove a passkey and open it again; pull the call card tab from the right edge; restart the app, open the attach sheet, tap a tall photo.

            EARLIER: SCREEN SHARE CARRIES YOUR PHONE'S SOUND.
            Screen share: the sound playing on your phone (videos, music) now goes to the other person, mixed with your voice.
            In-chat search: "Show as List" shows the results as a list, like the reference app.
            In-chat search opened from the profile: the keyboard now rises from the bottom after the page closes.
            PLEASE TEST: share your screen in a 1:1 call and play a video; search inside a chat and tap Show as List.

            EARLIER: SECURITY CHECKUP OPENS AT ONCE.
            Devices: tapping Security Checkup opens the sheet straight away, already checked. The sheet is only as tall as what it shows and slides up at that height.
            Call card: pulling it out of the edge, keep holding and move it left or right; it follows your finger and lands on the nearest side when you let go. The arrow on the RIGHT edge now follows your finger in a chat, like the left one.
            Attach sheet: tall photos and videos open with their rounded corners again.
            Attach sheet: photos and videos open at the reference speed again (about 0.7 seconds in all, most of it in the first 0.2), not the slow 2-second open. Closing is unchanged.
            PLEASE TEST: open Devices, tap Security Checkup a few times; open a tall photo from the attach sheet.

            EARLIER: THE APP NO LONGER STAYS DEAD UNTIL YOU RESTART IT.
            When the app's connection gets stuck (messages not sending, calls not ringing, username empty), it now notices, and the next time you leave the app it starts fresh on its own, the same as closing and reopening it. Never during a call. Unsent messages and stories go out after the fresh start.
            PLEASE TEST: use the app as normal; if it ever goes dead, just go to the home screen and come back.

            EARLIER: SLOWER OPENING.
            Attach sheet: a photo, a video or a selection now opens in 0.7 seconds and settles back over 1.3 seconds; the black behind still fades in 0.15 seconds.
            Editors: tall photos and videos (like screen recordings) show as the plain picture, with no rounded frame around them.
            Security Checkup: opens once, already checked (no "Checking..." sheet first), as a full sheet sliding up from the very bottom.
            Call card: the hidden card's handle is dark frosted glass (the blur could show white).
            PLEASE TEST: open photos and videos from the attach sheet and watch the opening and the settle.

            EARLIER: STORY UPLOAD CANCEL.
            Stories: the X on an uploading story cancels only that story; your other uploads keep going.
            PLEASE TEST: post two stories, tap X on one while both upload.

            EARLIER: EXACT OPENING TIMINGS.
            Attach sheet: a photo, a video or a selection opens in 0.4 seconds to a slight zoom past full size, then settles back over 0.5 seconds; the black behind fades in 0.15 seconds.
            PLEASE TEST: open photos and videos from the attach sheet and watch the opening and the settle.

            EARLIER: CHAT CRASH FIX, CALL CARD PULL-OUT, NO BLUR ON PHOTOS.
            Chats: opening a chat no longer crashes on iOS 27 (builds 919 and 920 crashed here).
            Call card: the edge tab is now a handle on the hidden card itself, showing the call blurred. Pull it and the whole card slides out with the handle leading; the blur clears as it comes. Hiding it slides it off from where it is, not from the corner.
            Attach sheet: a photo or video opens sharp straight away, never blurred first. The opening is slower, with a long gentle settle at the end. The top-left X also shows in the folder list and inside a folder.
            Video editor: the trim bar fades in like the caption bar.
            PLEASE TEST: open several chats; hide the call card to each side and pull it back out; open photos and videos from the attach sheet, in Recents and in a folder.

            EARLIER: LINKS IN THE OFFICIAL CHAT, FASTER ATTACH SHEET.
            Official chat: a web address in a message (like fariin.com/help) is now a link. Tap it and it opens in the app's browser, like the link buttons.
            Attach sheet: your recent photos are loaded before the sheet opens, so it opens without a pause. The opened photo is sharp again (918 showed the rough preview) and no longer shrinks a little at the end of its opening. The X at full height now sits top-left of the sheet, 44pt glass, and the album button is back at the bottom.
            Security Checkup: the sheet slides up at its proper height; the setup pages' X has one ring, not two.
            Call card: pull the edge arrow and the card slides out under your finger, blurred with the arrow, clearing as it comes.
            Attach sheet with photos selected: tapping an unselected photo opens that photo, not the selection.
            PLEASE TEST: open the Fariin official chat and tap fariin.com/help in a message; open a photo from the attach sheet; open Security Checkup and a setup page.

            EARLIER: STORY SWITCH TIMING RECORDED, ATTACH SHEET SELECTION.
            Stories: the phone now writes down the timing of every person switch (nothing on screen). Swipe through 2 or 3 video stories, keep the app open 10 seconds, then tell me; I read the record and fix the real cause of the late start.
            Attach sheet: with photos or videos already selected, tapping one flies out of its tile and opens on the one you tapped. X or swipe down puts it back in its own tile.
            Attach sheet photos and videos: the picture starts flying the instant you tap (it used to wait for the full photo or video file first); it sharpens in the air, the editor's tools unlock when the full photo is in, and a video's player is built the moment its file is ready. The tools now only ever fade in; the occasional slide-up from the bottom is gone.
            Attach sheet: with the sheet at full height and the grid scrolled a row, the left button becomes an X that closes the sheet; it goes back to the album button when the sheet starts to shrink or you scroll back to the top.
            Call card: the edge arrow stays on the edge. Pull it a little or tap it and the card comes back; it no longer rides your finger across the screen.
            Also: sign-in alerts switch is off by default; a 4pt gap between an official post's title and its text.
            PLEASE TEST: swipe between video stories; select two photos, tap one, swipe, close; stash the call card and pull its arrow.

            EARLIER: CALL CARD DRAG, ATTACH OPEN SPEED, SECURITY CHECKUP FIXES.
            The floating call card follows your finger again while you drag it (it only jumped when you let go).
            Attach sheet: photos and videos open at the reference speed (a fast start, no slow motion), and their buttons only fade in (they slid up from the bottom). X while zoomed in closes straight back to the tile.
            Security Checkup: "Yes, these are mine" now stays green; the sheet fits its content; Passkey, Chat Key, Password and device pages open with the header in place.
            Edit Photo sheet uses the normal background, not the photo's colour.
            Stories: the next person's video is ready and plays the moment the turn lands.
            PLEASE TEST: drag the call card around; open, zoom and close a photo from the attach sheet; Security Checkup, tap Yes; swipe between video stories.

            EARLIER: ATTACH PHOTOS AND VIDEOS, SECURITY CHECKUP.
            Tap a photo or a video in the attach sheet: it grows out of its tile slowly and smoothly, and the buttons fade in while it moves. X or swipe down puts it back in its tile.
            Security Checkup opens at 70% height. "Review new devices" now asks "Are these you?": Yes turns it green, No takes you to Devices.
            Story heart: a small vibration and pop when you like a story.
            Also: minimize is the floating call card again (picture-in-picture test removed), its edge tab follows your finger; stories no longer restart the next person's clip; Add to Reading List removed from the browser menu.
            PLEASE TEST: open and close photos and videos from the attach sheet; open Security Checkup; like a story.

            EARLIER: CALLS, BROWSER, STORIES.
            Minimize on a 1:1 call now opens Apple's own picture-in-picture window (test). Tap its expand button to come back.
            A call nobody answers stays on a "No answer" page: Cancel, Record voice message, Call again.
            The green Return button in Calls shows the moment you dial and stays until the call ends.
            Browser redesigned: X top-left; back, address bar with menu and reload, and Safari button at the bottom.
            Stories: the next person's video waits until the cube has finished turning.
            Also: Official Chat bell is an outline icon; attach photo opens from its tile; Devices page Security Checkup.
            PLEASE TEST: minimize a call; call someone who won't answer; swipe between video stories; open a link.

            EARLIER: "APP GOES DEAD UNTIL I REFRESH", PART 2.
            The app now notices a stuck connection within about 20 seconds and reconnects by itself, retrying every minute at most. Before, your own unsent message fooled it into thinking all was fine, and a leftover call state could block the reconnect for hours.
            A hidden log on the phone records what got stuck. Nothing on screen.
            Also: the call card's edge tab is really slim now; browser bottom icons are the normal iPhone size.
            PLEASE TEST: use it normally. If it goes dead again, wait 1 minute before refreshing, then tell me the time.

            EARLIER (911): FIX FOR "THE APP GOES DEAD UNTIL I REFRESH".
            Messages not sending, username empty, calls not ringing, Devices stuck loading, story upload and archive doing nothing: one stuck security check was blocking all of them. It now gives up after 6 seconds and the app carries on.
            Also: minimized voice call is a black card with their face big; slim tab on the call card edge; green Return pill on the live call in Calls; voice calls no longer start on loudspeaker; QR code logo in a clean hole; browser bottom bar as two glass capsules; link preview skeleton; story link text opens the story like its card.
            PLEASE TEST: use the app normally for a few days without refreshing. If messages stop sending again, tell me straight away.

            EARLIER (910): SETTINGS PROFILE BUTTONS.
            Edit profile and Share profile no longer show a cut edge when you press them.
            PLEASE TEST: press and hold each button in Settings.

            EARLIER (909): GLASS BROWSER, LINKS OPEN DIRECTLY, YOUTUBE CARD ON QUICK SEND, REPOSTS OF MY STORY.
            Browser: no bars and no lines. Liquid glass close, address and menu float at the top; one glass capsule at the bottom with back, forward, share, bookmark (Reading List) and open in Safari. Reload is in the menu.
            Tapping a link opens the browser straight away, no "Open link?" question.
            A link sent before its preview finished loading still gets the card (waits up to 3 seconds). Older messages stay as they were.
            Repost of my story: tapping my name or face at the top of a full-screen repost opens my story (not my profile); swiping my story down lands on my own card in the Stories list.
            PLEASE TEST: paste a YouTube link and send at once; tap links; scroll a page; open my story from a friend's repost (card and full-screen) and swipe down.

            EARLIER (908): KULAN'S OWN IN-APP BROWSER.
            Every web link now opens in Kulan's own browser sheet, not Safari: chat links, link cards, profile links, Settings help/privacy/terms, sign-up terms.
            Title and address at the top with the menu and close; back, forward, reload and share at the bottom. Scroll down and the bars get out of the way; scroll up or tap the slim top bar to bring them back.
            Swipe from the left/right edge for back/forward; hold Back or Forward to see history. Menu: reload, copy link, share, find on page, text size, open in Safari.
            Phone numbers and email links still go to the phone/mail app. Swipe down to close.
            PLEASE TEST: tap links in a chat, a profile and Settings; scroll a long page up and down; go back and forward; close and reopen.

            ALSO IN THIS BUILD: YOUTUBE CARDS, UNPIN, STORY REACTIONS, REPOST, SETTINGS.
            YouTube links: the video's real cover with a play button, the title and channel; tapping opens the YouTube app, or the browser if it is not installed.
            Unpin: the pin button only opens its menu now; if an unpin fails, a message says why.
            Story reactions: no swipe to reply and no long press.
            A repost of your own story: tapping your name swaps the same screen to your story; swipe down returns to the list where it was.
            Settings search uses your Settings icons. Edit Photo is a small sheet.
            PLEASE TEST: send a YouTube link and tap it; unpin from the bar; swipe and long-press a story reaction; open your story from a friend's repost and swipe down.

            EARLIER (906): SWIPE TO THE NEXT PERSON'S VIDEO, UNPIN, STORY REACTIONS.
            Swiping from one person's video story to the next: the video starts as soon as the swipe ends (the extra second is gone).
            Pinned bar: Unpin from the pin button's menu works every time.
            Story reactions: the emoji is drawn over the story card and bigger; a react-bar reaction can't be replied to or reacted to.
            PLEASE TEST: swipe between several people's video stories, also fast; unpin from the bar; react to a story and long-press the reaction.

            EARLIER (905): A REPOST OF YOUR OWN STORY OPENS YOUR STORY, PLUS SETTINGS SEARCH.
            In a friend's repost of your story, tapping your name in the middle opens your original story (the exact one they reposted), not your profile. If you deleted it or it expired, a message says so.
            PLEASE TEST: have a friend repost your story; open their story, tap the middle, tap your name. Then delete your original and try again.

            EARLIER: STORY REACTIONS ON THE CARD.
            A reaction sent with a story's react bar now sits on the corner of the story card in the chat, with the time under the card (incoming: right corner; outgoing: left corner). Typed replies and older reactions look as before.
            PLEASE TEST: react to someone's story with the react bar, then look at it in the chat on both phones.

            EARLIER: PINNED BAR, GOLD BADGE EVERYWHERE, REPOST PROFILE.
            Pinned bar: shows the real pinned message the moment you open the chat (no more "Pinned Message / Tap to view"). Unpin removes it at once, and says why if it fails.
            Gold badge: also on the saved accounts at Log In (after that account is opened once) and on the story header.
            Repost: open the person's profile from the bubble in the middle, close it, and the story keeps its name and badge and plays again.
            PLEASE TEST: open a chat with a pin twice; unpin; the Log In accounts list; a repost's middle bubble, open profile, scroll, close.

            EARLIER (902): SETTINGS SPACING. Edit profile and Share profile sit just under your username.

            EARLIER (901): STORY VIDEOS PLAY RIGHT AFTER THE SWIPE, STORY REPLY FIXES, BADGES, SETTINGS.
            The video you are about to swipe to (next story, next person, previous person) is downloaded in full ahead, so it plays as soon as the turn ends.
            Story replies: no big gap between the preview and the reply; the grey line sits next to the picture; opening and closing the story from a reply works like a story link.
            Verified badges: one size and colour for everybody; gold for companies (Business, Organization); the owner sets the Fariin badge (Settings > Official Announcements).
            Settings: the old design, plus Edit profile and Share profile buttons. Chat list search: the X to close it is back.
            Edit profile: names that copy a company, Fariin or a verified person are refused.
            PLEASE TEST: swipe between people's video stories, watched and new, on Wi-Fi and mobile data; a story reply that is the first message of the day; tap a story reply preview; chat list search X.

            EARLIER: CLEARER MESSAGES FOR SUSPENDED AND BANNED ACCOUNTS.
            A suspended account now sees "Account suspended" instead of "signed out from another device", and a clear message when it tries to sign in.
            A banned account is told "Can't upload story right now" before the story picker opens, not after the upload fails.
            PLEASE TEST: suspend a test account from the admin panel and open the app on it; ban a test account and tap add story.

            EARLIER: NEXT PERSON'S VIDEO READY BEFORE YOU SWIPE, PLUS 3 STORY FIXES.
            The person before and after the one you watch get their video player ready in advance, so swiping to them should start the video at once.
            Brightness: the uploading card and the first second of the posted story now show your edited brightness, not the original.
            Story editor: a tall phone-camera video shows as one upright picture, not split into sideways pieces.
            Story editor: NEXT stays on one line on smaller iPhones.
            PLEASE TEST: one person's video then swipe to the next person's video, back and forward, watched and new, also on mobile data; post a video with brightness raised; pick a tall camera video; NEXT on a small iPhone.

            EARLIER: STORY VIDEOS START LIKE THE REFERENCE APP, PLUS 3 FIXES.
            The next video's opening is saved as it downloads and the player uses it at once, no second download. All story downloads share one connection, the story you watch goes first.
            After sending a reaction, the video plays again as soon as the keyboard closes.
            Brightness on a story video is kept after upload.
            Saved accounts: the loading spinner shows in the account row you tapped.

            EARLIER: VIDEO STORIES START WITHOUT THE SMALL WAIT.
            A video story whose opening is already downloaded now starts as soon as its first frames are ready, instead of pausing a moment first.
            The repost bubble (tap the middle of a repost) shows the person's real photo, not a letter.
            PLEASE TEST: someone's stories with a photo then videos; tap Next quickly; tap the middle of a repost.

            EARLIER: CRASH FIX.
            Build 895 could crash while watching video stories. Fixed; videos still start at once.
            PLEASE TEST: watch video stories and tap Next quickly through them.

            EARLIER: VIDEO STORIES START AT ONCE.
            Tapping Next from a story onto a video no longer sits frozen on the first frame for seconds: a video whose opening is already downloaded starts straight away, and the next story's opening downloads first.
            PLEASE TEST: open someone's stories with a photo then videos, tap Next quickly through them; also on mobile data.

            EARLIER: STORY SOUND AND CHAT TAP FIXES.
            Story videos play through the loudspeaker, not the call earpiece, after you have opened a chat or made a call. Video stories play again after you open and close the story camera while on a call in another app. Tapping the name or the repost line in a story header now presses like a button before the profile opens. Tapping the empty strip under a chat's header no longer flies the chat to its first message.
            PLEASE TEST: open a chat, then watch a video story (sound from the bottom speaker); on a call in another app, open the story camera, close it, play a video story; tap a story header's name and repost line; in a chat, tap just under the header.

            EARLIER: STORY VIDEO AND REPOST FIXES.
            Video stories start sooner: they play once half a second is loaded, and the opening of each person's first story is downloaded ahead (about 3.5 seconds, on Wi-Fi and now on mobile data for the first 10 people). A reposted video plays by itself again in the repost editor. Tapping a repost shows the original author's real photo in the bubble, not a letter.
            Message requests: the name and blurred photo block under the chat header is gone, and with it the black band above the messages. Someone whose message request you have not accepted no longer sees your stories, and you no longer see theirs; accepting shares them as normal.
            PLEASE TEST: open video stories on Wi-Fi and on mobile data and check how fast they start; repost a video (it plays, name and face show); tap a posted repost and check the bubble photo; open a message request from someone new.

            EARLIER: ONE MORE VERIFIED BADGE FIX.
            A badge given while a profile was loading could still disappear until the next refresh; it now stays.
            PLEASE TEST: give a badge on the panel while the person's profile is open on the phone; it should appear and stay.

            EARLIER: VERIFIED BADGE NO LONGER COMES AND GOES.
