name: iOS Build

# Manual only — so pushing code while developing a batch costs nothing.
# I run this compile-check once per batch (then the TestFlight build), to keep
# CI minutes (and your $15 budget) spent only when we mean to.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The owner's standing order, enforced by the machine: this repo is public, and no code or
      # workflow file names another messenger by brand ("the reference app" instead; provenance
      # lives in private notes). The same check runs as a pre-commit hook locally
      # (tools/githooks); this is the net for a clone that never installed it.
      - name: No brand names in the public repo
        run: |
          if grep -rnE '\b(Signal|Telegram|WhatsApp|Viber|WeChat)\b' --include='*.swift' Kulan; then
            echo "::error::An app source comment names another messenger by brand. Say 'the reference app'."
            exit 1
          fi
          echo "clean"

      - name: Select latest Xcode (need iOS 26 SDK for .glassEffect etc.)
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages (retry, clearing corrupt binary-framework artifacts)
        run: |
          for i in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies -project Kulan.xcodeproj -scheme Kulan; then
              echo "package resolution succeeded on attempt $i"; break
            fi
            echo "::warning::SPM resolve attempt $i failed (likely a partial WebRTC/Firebase download). Clearing artifacts and retrying."
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages
            if [ "$i" = "4" ]; then echo "::error::SPM resolution failed after 4 attempts"; exit 1; fi
            sleep 10
          done

      # First milestone: compile for the simulator (no signing). Proves the whole
      # stack builds — SwiftUI + Firebase + libsodium + Crypto.swift — before we
      # add signing/TestFlight.
      - name: Build (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Kulan.xcodeproj \
            -scheme Kulan \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
