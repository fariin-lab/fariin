# XcodeGen spec — generates Kulan.xcodeproj on the CI runner (no Mac needed to author).
# Run: `xcodegen generate` inside native/
name: Kulan
options:
  bundleIdPrefix: com.kulan
  deploymentTarget:
    iOS: "26.0"   # iOS 26+ only — no legacy fallbacks; build with the latest APIs
  createIntermediateGroups: true

packages:
  # Prebuilt xcframeworks mirror (same version, same products) — downloads from GitHub
  # releases instead of Google's servers, which beats the SPM binary-download hang on CI
  # and skips the long Firebase source compile.
  Firebase:
    url: https://github.com/akaffenberger/firebase-ios-sdk-xcframeworks
    exactVersion: "11.15.0"
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: "0.9.1"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
  # Group calls. LiveKit ships its own LK-prefixed WebRTC, so it coexists with stasel/WebRTC
  # (used for 1:1). Binary comes from GitHub releases — fine on this CI (like the Firebase mirror).
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
  # Story viewer (MIT, vendored as a LOCAL package so we own + customize the source:
  # header→profile tap, swipe-down dismiss, exact Instagram sizing, transitions).
  StoryUI:
    path: StoryUI
  # (TOCropViewController removed 2026-08-03 on the owner's word: "use my owner crop… remove that
  # library". The story editor was its only caller and now uses ChatCropView, which is ours and is
  # what the chat's image editor has always used. One cropper in the app instead of two.)

targets:
  Kulan:
    type: application
    platform: iOS
    sources:
      - path: Kulan
    info:
      path: Kulan/Info.plist
      properties:
        CFBundleDisplayName: Fariin
        # NOT the same key, and the difference is visible. CFBundleDisplayName is the home-screen
        # label; CFBundleName is what iOS uses when the SYSTEM speaks about the app, and it defaults
        # to the target name, which is still Kulan. So the Google sign-in prompt read
        # `"Kulan" Wants to Use "accounts.google.com" to Sign In` on a build where every other
        # surface already said Fariin — caught by the owner in a screenshot. Rename stage 1 changed
        # the label and missed this. Apple wants 15 characters or fewer here.
        CFBundleName: Fariin
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Alternate app icons (Settings > Appearance > App Icon). Primary stays the asset
        # catalog; these are loose PNGs in Resources/AltIcons, referenced by base name.
        CFBundleIcons:
          CFBundleAlternateIcons:
            # ONE MARK, SEVERAL GROUNDS. The tri-arrow icons that used to live here (blue/ivory/chrome)
            # were the PREVIOUS logo, kept around after the speech bubble replaced it; the user asked
            # for them gone (2026-07-29). Every icon below is the current bubble, composited from the
            # black master onto a flat ground, so the set cannot drift from the brand.
            #
            # Black already existed as the primary icon's dark APPEARANCE in the asset catalog, but that
            # variant only swaps itself in on a dark Home Screen and can never show in the in-app
            # picker — so the user could not find it and reasonably concluded it was never added. It is
            # both now: automatic on dark, and choosable outright.
            icon-black:    { CFBundleIconFiles: [icon-black] }
            icon-graphite: { CFBundleIconFiles: [icon-graphite] }
            icon-indigo:   { CFBundleIconFiles: [icon-indigo] }
            icon-emerald:  { CFBundleIconFiles: [icon-emerald] }
            icon-crimson:  { CFBundleIconFiles: [icon-crimson] }
            icon-sand:     { CFBundleIconFiles: [icon-sand] }
        # Export compliance: 2026-07-24 the account owner made the determination that Kulan
        # QUALIFIES FOR THE STANDARD EXEMPTION (uses standard, publicly-available crypto —
        # libsodium — and is offered as a mass-market app; France distribution = No). That was
        # answered in ASC for build 363, and Apple's own dialog directs declaring it in the plist
        # so every future build auto-clears instead of sitting "Missing Compliance". Hence:
        ITSAppUsesNonExemptEncryption: false
        # ⛔ THE 120Hz OPT-IN, AND WITHOUT IT A PROMOTION PHONE RUNS THIS APP AT 60.
        # iOS caps every app to a 60Hz maximum frame duration unless this key says otherwise; it is
        # not a hint and there is no code-side substitute. The story cube is what forced it: a peer
        # turn is 0.165s, so at the 60Hz cap a whole face is about TEN frames, and the owner reads
        # those ten frames as lag on a tap (a swipe hides it, because the finger has already done
        # most of the rotation before the clock starts). Doubling the frame budget is his own
        # instruction, verbatim: "use the speed you used before, just make it smooth and more fps".
        #
        # ⚠️ THE KEY ALONE IS ONLY HALF. It lifts the ceiling; each CADisplayLink still has to ASK
        # for the higher rate through `preferredFrameRateRange`, which the cube's settle now does.
        # A link that does not ask keeps running at 60 with the key set, which is exactly how this
        # looks like it did nothing.
        CADisableMinimumFrameDuration: true
        # NOTE: this is the owner's export-compliance declaration. If the app's crypto or its
        # distribution (e.g. enabling France, or a stricter reading of E2EE as non-exempt) changes,
        # revisit this — the earlier stance treated E2EE as NON-exempt (would be `true` + an
        # ITSEncryptionExportComplianceCode issued by ASC).
        NSPhotoLibraryUsageDescription: "Fariin needs photo access so you can send pictures in chats."
        NSPhotoLibraryAddUsageDescription: "Fariin needs permission to save photos to your camera roll."
        NSCameraUsageDescription: "Fariin needs camera access so you can take photos in chats."
        NSMicrophoneUsageDescription: "Fariin needs microphone access so you can send voice messages."
        NSFaceIDUsageDescription: "Fariin uses Face ID to unlock the app."
        NSLocationWhenInUseUsageDescription: "Fariin uses your location to share it in a chat and to suggest nearby places for a story."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.kulan.messenger
            CFBundleURLSchemes: [kulan]
          # Google sign-in OAuth redirect (the reversed client id from GoogleService-Info).
          - CFBundleURLName: com.kulan.messenger.google
            CFBundleURLSchemes: [com.googleusercontent.apps.522284693527-teio4ph7vaedv5s59l3u589sjdfnavt2]
        UIBackgroundModes: [voip, audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kulan.messenger.native
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Kulan/Kulan.entitlements
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseFunctions
      - package: Sodium
        product: Sodium
      - package: WebRTC
        product: WebRTC
      - package: LiveKit
        product: LiveKit
      - package: StoryUI
        product: StoryUI
    # Attaching the tests to the app's own scheme is what makes `xcodebuild test -scheme Kulan`
    # find them. Without it the scheme has no test action and the command passes having run nothing,
    # which is worse than failing.
    scheme:
      testTargets:
        - KulanTests

  # Unit tests for logic that can run with no network and no device: the weak-link pause/resume
  # decision and the upload staging guarantee. Deliberately NOT a UI or integration suite. Anything
  # touching Firestore, Storage or a live peer connection belongs on a device, not here.
  KulanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KulanTests
    dependencies:
      - target: Kulan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
